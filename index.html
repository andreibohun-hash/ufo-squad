// След «кругов на полях» после похищения (03.10, Андрей: «после похищения на время след, как на полях»): примятая трава узором.
// Узоров семь (04.10, Андрей: «круги на полях давай сделаем разных форм — штук 5–7 разных паттернов»): каждый — именованная
// функция, рисуется один раз в свою текстуру 512 (§11). Белым по прозрачному в круге радиуса 1 (цвет даёт материал по теме
// уровня), тонкие вырезанные штрихи — направление уложенной травы. fancy — узор с цепочками мелких кругов: его чаще берёт
// крупный след (pickCrop).
const TAU = Math.PI * 2;
// Приёмы узоров: холст переводится в единичный круг (центр — середина холста, радиус 1 — край). disc/ring — примятые круг и
// кольцо (внутренний круг — полный оборот против часовой: прежний arc(…, 0, 7, true) недокручивал 41° и давал «шип» на
// кольце); trail — полоса переменной ширины по кривой f(t) → [x, y, полуширина], t от 0 до 1 (контур по двум кромкам,
// концы круглые); laid — вырезать штрихи уложенной травы; swirl — водоворот штрихов в круге; comb — штрихи вдоль кольца.
function cropKit(c, n){
  const h = n / 2; c.translate(h, h); c.scale(h, h); c.fillStyle = '#fff';
  const K = {
    disc(x, y, r){ c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); },
    ring(r0, r1){ c.beginPath(); c.arc(0, 0, r1, 0, TAU); c.moveTo(r0, 0); c.arc(0, 0, r0, TAU, 0, true); c.fill(); },
    trail(f, steps){
      const P = []; for (let i = 0; i <= steps; i++) P.push(f(i / steps));
      const edge = sg => P.map((p, i) => { const a = P[Math.max(0, i - 1)], b = P[Math.min(steps, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [p[0] - dy / l * p[2] * sg, p[1] + dx / l * p[2] * sg]; });
      c.beginPath(); for (const q of edge(1).concat(edge(-1).reverse())) c.lineTo(q[0], q[1]); c.closePath(); c.fill();
      K.disc(P[0][0], P[0][1], P[0][2]); K.disc(P[steps][0], P[steps][1], P[steps][2]);
    },
    laid(draw){ c.save(); c.globalCompositeOperation = 'destination-out'; c.lineWidth = 0.012; c.strokeStyle = 'rgba(0,0,0,0.3)'; draw(); c.restore(); },
    swirl(x, y, r, k, turn){ K.laid(() => { for (let j = 0; j < k; j++){ const a0 = j / k * TAU; c.beginPath(); for (let i = 0; i <= 24; i++){ const f = i / 24, a = a0 + f * turn; c.lineTo(x + Math.cos(a) * f * r, y + Math.sin(a) * f * r); } c.stroke(); } }); },
    comb(r0, r1){ K.laid(() => { for (let r = r0; r < r1; r += 0.024){ c.beginPath(); c.arc(0, 0, r, 0, TAU); c.stroke(); } }); },
  };
  return K;
}
// «Кольца» — классика: примятый центр, три кольца, шесть спутников на средней дорожке и три — на внешней.
function cropRings(c, n){
  const K = cropKit(c, n);
  K.disc(0, 0, 0.25); K.ring(0.35, 0.47); K.ring(0.6, 0.67); K.ring(0.85, 0.91);
  for (let k = 0; k < 6; k++){ const a = k / 6 * TAU; K.disc(Math.cos(a) * 0.635, Math.sin(a) * 0.635, k % 2 ? 0.075 : 0.11); }
  for (let k = 0; k < 3; k++){ const a = k / 3 * TAU + Math.PI / 6; K.disc(Math.cos(a) * 0.88, Math.sin(a) * 0.88, 0.09); }
  K.swirl(0, 0, 0.25, 16, 2.2); K.comb(0.37, 0.465);
}
// «Спираль» — большой круг в центре и цепочка кругов, которые мельчают, уходя по спирали к краю (в духе «Множества Жюлиа», 1996).
function cropJulia(c, n){
  const K = cropKit(c, n), A = 1.25 * TAU;
  K.disc(0, 0, 0.24);
  for (let th = 0; th <= A;){ const f = th / A, rho = 0.38 + 0.52 * f, s = 0.125 * (1 - 0.77 * f); K.disc(Math.cos(th) * rho, Math.sin(th) * rho, s); th += 2.25 * s / rho; }
  K.swirl(0, 0, 0.24, 16, 2.6);
}
// «Трискель» — три сплошных рукава-вихря из центра: толстые у середины, тонкие к концам.
function cropTriskel(c, n){
  const K = cropKit(c, n);
  for (let j = 0; j < 3; j++){ const a0 = j / 3 * TAU; K.trail(t => { const rho = 0.06 + 0.82 * t, a = a0 + 2.9 * t; return [Math.cos(a) * rho, Math.sin(a) * rho, 0.15 * Math.pow(1 - t, 0.8) + 0.025]; }, 180); }
  K.disc(0, 0, 0.2);
  K.swirl(0, 0, 0.2, 12, 2.9);
}
// «Цветок» — восемь лепестков-линз вокруг круга с кольцом, точки между кончиками, тонкая внешняя рамка.
function cropFlower(c, n){
  const K = cropKit(c, n);
  K.disc(0, 0, 0.16); K.ring(0.21, 0.26);
  for (let j = 0; j < 8; j++){ const a = j / 8 * TAU, ca = Math.cos(a), sa = Math.sin(a), b = a + TAU / 16;
    K.trail(t => [ca * (0.31 + 0.55 * t), sa * (0.31 + 0.55 * t), 0.13 * Math.pow(Math.sin(Math.PI * t), 0.7)], 90);
    K.disc(Math.cos(b) * 0.78, Math.sin(b) * 0.78, 0.04); }
  K.ring(0.91, 0.945);
  K.swirl(0, 0, 0.16, 12, 2.2);
  K.laid(() => { for (let j = 0; j < 8; j++){ const a = j / 8 * TAU; c.beginPath(); c.moveTo(Math.cos(a) * 0.35, Math.sin(a) * 0.35); c.lineTo(Math.cos(a) * 0.82, Math.sin(a) * 0.82); c.stroke(); } });
}
// «Галактика» — шесть закрученных рукавов из точек, которые крупнеют от ядра и мельчают к краю (в духе Милк-Хилла, 2001).
function cropGalaxy(c, n){
  const K = cropKit(c, n);
  K.disc(0, 0, 0.14); K.ring(0.19, 0.22);
  for (let j = 0; j < 6; j++) for (let i = 0; i <= 10; i++){ const f = i / 10, rho = 0.29 + 0.6 * f, a = j / 6 * TAU + 1.9 * f; K.disc(Math.cos(a) * rho, Math.sin(a) * rho, 0.022 + 0.042 * Math.sin(Math.PI * (0.2 + 0.7 * f))); }
  K.swirl(0, 0, 0.14, 10, 2.4);
}
// «Атом» — ядро и три орбиты-эллипса через 60°, на каждой по электрону.
function cropAtom(c, n){
  const K = cropKit(c, n);
  c.strokeStyle = '#fff'; c.lineWidth = 0.06;
  for (let j = 0; j < 3; j++){ c.beginPath(); c.ellipse(0, 0, 0.84, 0.3, j / 3 * Math.PI, 0, TAU); c.stroke(); }
  K.disc(0, 0, 0.18);
  for (let j = 0; j < 3; j++){ const rot = j / 3 * Math.PI, u = 0.7 + j * 2.3, ex = Math.cos(u) * 0.84, ey = Math.sin(u) * 0.3; K.disc(ex * Math.cos(rot) - ey * Math.sin(rot), ex * Math.sin(rot) + ey * Math.cos(rot), 0.08); }
  K.swirl(0, 0, 0.18, 14, 2.4);
}
// «Треугольник» — треугольник в кольце, на вершинах круги с ободками, в центре круг с кольцом (в духе Барбери-Касла, 1991).
function cropTriangle(c, n){
  const K = cropKit(c, n), V = [0, 1, 2].map(j => { const a = j / 3 * TAU - Math.PI / 2; return [Math.cos(a) * 0.68, Math.sin(a) * 0.68]; });
  K.ring(0.665, 0.695);
  c.strokeStyle = '#fff'; c.lineWidth = 0.055; c.lineJoin = 'round';
  c.beginPath(); for (const v of V) c.lineTo(v[0], v[1]); c.closePath(); c.stroke();
  K.disc(0, 0, 0.17); K.ring(0.24, 0.28);
  c.lineWidth = 0.03; for (const v of V){ K.disc(v[0], v[1], 0.13); c.beginPath(); c.arc(v[0], v[1], 0.2, 0, TAU); c.stroke(); }
  K.swirl(0, 0, 0.17, 12, 2.2);
}

  end(){ this.mesh.count = this.n; this.mesh.visible = this.n > 0; if (this.n){ upload(this.mesh.instanceMatrix, this.n * 16); upload(this.mesh.instanceColor, this.n * 3); } }

// Пул «палочек» между двумя точками: связи строя и лазеры.
const _Y = new THREE.Vector3(0, 1, 0), _D = new THREE.Vector3();
class BeamPool {
  constructor(cap, mat, seg, parent){
    const geo = new THREE.CylinderGeometry(1, 1, 1, seg || 6, 1, true);
    this.mesh = new THREE.InstancedMesh(geo, mat, cap); this.mesh.frustumCulled = false; this.mesh.count = 0;
    for (let i = 0; i < cap; i++) this.mesh.setColorAt(i, WHITE);
    this.cap = cap; this.n = 0; parent.add(this.mesh);
  }
  begin(){ this.n = 0; }
  push(ax, ay, az, bx, by, bz, w, color){
    if (this.n >= this.cap) return;
    _D.set(bx - ax, by - ay, bz - az); const L = _D.length(); if (L < 1e-4) return; _D.divideScalar(L);
    _Q.setFromUnitVectors(_Y, _D);
    _M.compose(_V.set((ax + bx) / 2, (ay + by) / 2, (az + bz) / 2), _Q, _S.set(w, L, w));
    this.mesh.setMatrixAt(this.n, _M); this.mesh.setColorAt(this.n, color || WHITE); this.n++;
  }
  end(){ this.mesh.count = this.n; this.mesh.visible = this.n > 0; if (this.n){ upload(this.mesh.instanceMatrix, this.n * 16); upload(this.mesh.instanceColor, this.n * 3); } }
}
// Частицы: квадраты, всегда повёрнутые к камере. Живут в реальном времени.
class Particles {
  constructor(tex, cap, blend, parent){
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, blending: blend || THREE.NormalBlending, toneMapped: false });
    this.mesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), mat, cap); this.mesh.frustumCulled = false; this.mesh.count = 0; this.mesh.renderOrder = 5;
    for (let i = 0; i < cap; i++) this.mesh.setColorAt(i, WHITE);
    this.cap = cap; this.list = []; parent.add(this.mesh);
  }
  emit(x, y, z, o){
    if (this.list.length >= this.cap) this.list.shift();
    this.list.push({ x, y, z, vx: o.vx || 0, vy: o.vy || 0, vz: o.vz || 0, g: o.g === undefined ? -6 : o.g, life: o.life || 0.6, age: 0,
      size: o.size || 0.3, col: colorOf(o.col || '#ffffff'), spin: o.spin || 0, rot: VR() * 6, drag: o.drag || 0.9 });
  }
  update(dt){
    let n = 0;
    this.list = this.list.filter(p => (p.age += dt) < p.life);
    for (const p of this.list){
      p.vy += p.g * dt; const d = Math.pow(p.drag, dt * 10); p.vx *= d; p.vz *= d; p.vy *= Math.pow(0.98, dt * 10);
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.rot += p.spin * dt;
      if (p.y < 0.02){ p.y = 0.02; p.vy *= -0.3; }
      const k = p.age / p.life, sz = p.size * (k < 0.15 ? E.outBack(k / 0.15) : 1 - E.inQuad((k - 0.15) / 0.85) * 0.9);
      _E.set(0, 0, p.rot); _Q.setFromEuler(_E); _Q.premultiply(camera.quaternion);
      _M.compose(_V.set(p.x, p.y, p.z), _Q, _S.set(sz, sz, sz));
      this.mesh.setMatrixAt(n, _M); this.mesh.setColorAt(n, p.col); n++;
    }
    this.mesh.count = n; this.mesh.visible = n > 0; if (n){ upload(this.mesh.instanceMatrix, n * 16); upload(this.mesh.instanceColor, n * 3); }
  }
  clear(){ this.list.length = 0; this.mesh.count = 0; }
}

}

// --- предпросмотр и вспышка кольца: заливка многоугольника на земле ---
// Буферы выделены один раз на уровень, обновление — триангуляция по месту и дозаливка занятой части (03.10, оптимизация:
// раньше каждый шаг генерала у строя создавал новую ShapeGeometry — новые буферы в GPU несколько раз в секунду).
class PolyFill {
  constructor(mesh, maxPts){
    this.max = maxPts; this.pos = new Float32Array(maxPts * 3); this.idx = new Uint16Array((maxPts - 2) * 3);
    this.pa = new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage); this.ia = new THREE.BufferAttribute(this.idx, 1).setUsage(THREE.DynamicDrawUsage);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', this.pa); g.setIndex(this.ia); g.setDrawRange(0, 0);
    mesh.geometry.dispose(); mesh.geometry = g; mesh.frustumCulled = false;   // габарит не пересчитывается — не отсекать
    this.geo = g; this.v2 = Array.from({ length: maxPts }, () => new THREE.Vector2()); this.c = [];
  }
  set(pts){
    const n = Math.min(pts.length, this.max); if (n < 3){ this.clear(); return; }
    const c = this.c; c.length = n;
    for (let i = 0; i < n; i++) c[i] = this.v2[i].set(pts[i].x, -pts[i].z);
    if (!THREE.ShapeUtils.isClockWise(c)) c.reverse();            // как в ShapeGeometry: лицевая сторона смотрит вверх
    for (let i = 0; i < c.length; i++){ this.pos[i * 3] = c[i].x; this.pos[i * 3 + 1] = c[i].y; this.pos[i * 3 + 2] = 0; }
    const m = c.length, tris = THREE.ShapeUtils.triangulateShape(c, []);   // может срезать повтор последней точки
    let k = 0; for (const t of tris){ this.idx[k++] = t[0]; this.idx[k++] = t[1]; this.idx[k++] = t[2]; }

// в меньшем разрешении (×0.8 за шаг, не ниже SH.DPR_MIN). Не помогло (кадр не ускорился — например, режим энергосбережения

const DPRA = { t0: 0, n: 0, sum: 0, prev: 0, check: false, lock: false, was: 0 };
function adaptDpr(now, fms){
  if (G.screen !== 'game' || !G.s || document.hidden || DPRA.lock){ DPRA.t0 = now; DPRA.n = DPRA.sum = 0; return; }
  if (fms < 100){ DPRA.n++; DPRA.sum += fms; }          // одиночные рывки (сборка, вкладка) не в счёт
  if (now - DPRA.t0 < 2000) return;

  }

    const P = (x, z) => { const q = project(x, 0, z); return [Math.round(q.x), Math.round(q.y)]; }, T = G.ta;
    const L = T ? tutLive() : s.animals.filter(a => a.state === 'free' && !a.hid && aimOk(a, aimR(s)));
    return { screen: G.screen, step: T ? T.step : '', k: T ? T.k : 0, tutDone: !!G.save.tutAim, level: s.L.id, ret: P(s.leader.x, s.leader.z), live: L.slice(0, 12).map(a => P(a.x, a.z)),
      bait: s.baits[0] ? P(s.baits[0].x, s.baits[0].z) : null, baitReady: s.t >= s.baitAt, marks: s.marks.length, lock: +s.lock.toFixed(2), boss: !!s.bossGame, won: s.won, lost: s.lost, t: +s.t.toFixed(2), errs: (G.errs || []).length, err, W: fx.clientWidth, H: fx.clientHeight }; },
  pile(on){ if (on !== undefined) setPile(on); return G.pile; },   // механика: true — «Куча-мала», false — обводка (со следующей партии)
  core(c){ if (c) setCore(c); return G.core; },                     // механика: 'ring' | 'pile' | 'beam' (со следующей партии)
  battle(){ startBattle(); return this.state(); },
  goto(screen){ goto(screen); return G.screen; },
  drive(sec){                                   // ручной прогон игрового времени: rAF заморожен в скрытой вкладке
    if (!G.s) return this.state(); if (G.screen === 'pause') goto('game'); const steps = Math.round(sec / CFG.DT);
    for (let i = 0; i < steps && G.screen === 'game'; i++) simStep();
    render(sec); return this.state();
  },
  until(type, maxSec, after){                 // гнать время, пока не случится событие type (+ after с), — для кадров эффектов
    if (!G.s) return null; if (G.screen === 'pause') goto('game'); let seen = -1;
    for (let i = 0; i < Math.round((maxSec || 20) / CFG.DT) && G.screen === 'game'; i++){
      G.evTypes.clear(); simStep();
      if (seen < 0 && G.evTypes.has(type)) seen = G.s.t;
      if (seen >= 0 && G.s.t - seen >= (after || 0)) break;
    }
    render(0.05); return seen >= 0 ? this.state() : null;
  },
  bot(kind){ return setBot(kind === undefined ? 'casual' : kind); },
  unlockAll(){ return unlockAll(); },
  Music, Sfx,                                     // для проверки звука (офлайн-рендер песни)
  music(on){ if (on !== undefined){ G.save.music = !!on; save(); musicFor(G.screen); } return { on: Music.on, bpm: Music.bpm, tr: Music.tr, step: Music.step, hurry: Music.hurry }; },
  INP, trace(on){ G.traceOn = on !== false; G.trace = []; return G.traceOn; },   // диагностика ввода: запись каждого шага
  speed(x){ return setSpeed(x || 1); },
  add(k){ return addAliens(k || 10); },
  control(m){ return setControl(m || 'stick'); },
  god(on){ G.god = on !== false; if (G.s && G.s.mode !== 'battle') G.s.L = Object.assign({}, LEVELS[G.li], G.god ? { time: 1e9 } : {}); return G.god; },
  reset(){ try { for (const v of ['.v1', '.v2', '.v3']) localStorage.removeItem(NAME + v); } catch (e) {} location.reload(); },
  portraits(keys, size){ return renderPortraits(keys || Object.keys(ART).concat('saucer'), size || 256); },
};

// --- старт ---
G.pile = G.core === 'pile'; G.beam = G.core === 'beam';              // механика спайка — из сохранённого выбора
fit();
loadPortraits();
const startHash = location.hash.slice(1);
if (startHash === 'dev') $('dev').classList.add('show');
if (startHash === 'game') startLevel(G.save.level);
else if (startHash === 'pause'){ startLevel(G.save.level); goto('pause'); }
else goto(SCREENS.includes(startHash) ? startHash : 'menu');
requestAnimationFrame(frame);
log('event', 'boot', 'levels=' + LEVELS.length + ' three=' + THREE.REVISION + ' reduced=' + SH.REDUCED);
} // конец блока игры
</script>
</body>
