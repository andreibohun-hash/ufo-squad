<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UFO Squad</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7ec8f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Шрифты файлами (PROTO-BASE §1): Nunito — игровой текст, Oswald — «штабные» подписи, цифры, таймер. Латиница + кириллица. */
@font-face { font-family: 'Nunito'; font-weight: 200 1000; font-display: swap; src: url('vendor/nunito-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Nunito'; font-weight: 200 1000; font-display: swap; src: url('vendor/nunito-cyr.woff2') format('woff2');
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Oswald'; font-weight: 200 700; font-display: swap; src: url('vendor/oswald-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Oswald'; font-weight: 200 700; font-display: swap; src: url('vendor/oswald-cyrillic.woff2') format('woff2');
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
/* Визуальный язык «Штаб вторжения» (холст Claude Design «UFO Squad UI», 03.10): тёмный космос меты, игрушечные панели с той же
   толстой обводкой, что у 3D-моделей, лаймовое свечение пришельцев. Палитра — одно место (§9); игра — светлая сцена, мета — космос. */
:root{
  --space:#140b33; --space2:#1f1350; --space3:#2c1d6e; --panel:#33227c; --ink:#1a1033;
  --paper:#fff8ec; --paper2:#f3ecff; --lime:#a8ff5a; --lime2:#7fe83a; --limeD:#4fc21c; --limeInk:#173d05;
  --pink:#ff5fa2; --orange:#ff7a3d; --gold:#ffc93c; --cyan:#5ff0ff; --danger:#ff5d5d;
  --muted:#b9acef; --mutedD:#6c5fa8; --text:#f7f3ff; --textDark:#2b2140; --sub:#6c6283;
  --round:'Nunito', ui-rounded, system-ui, sans-serif; --tech:'Oswald', 'Arial Narrow', Impact, sans-serif;
  --frame-w:440px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--space);color:var(--text);font:16px/1.25 var(--round);font-weight:800;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100dvh;height:100svh;margin:0 auto;overflow:hidden;background:#8fd16a}
#game{position:absolute;inset:0;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx2d{pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%}
.ico{display:block;flex-shrink:0}
/* --- HUD (поверх сцены, касания не ловит, §9) --- */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 10px 0;pointer-events:none;color:var(--textDark);display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{background:var(--paper);border:3px solid var(--ink);border-radius:19px;box-shadow:0 4px 0 var(--ink);color:var(--textDark);display:flex;align-items:center;gap:6px;height:50px;padding:0 12px;white-space:nowrap}
.pill.squad{padding:0 12px 0 4px;gap:4px}
.pill.squad .ava{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.pill.squad .ava img{width:36px;height:36px;position:relative}
.pill.squad .ava svg{position:absolute;left:-3px;top:-3px}
.pill .sq{display:flex;flex-direction:column;line-height:1}
.pill .sq b{font:700 23px var(--tech)} .pill .sq small{font:900 11px var(--round);color:var(--sub)}
.pill.squad.full{background:#fff3b8}
.pill.time{font:700 28px var(--tech);min-width:92px;justify-content:center;gap:5px}
.pill.time.hurry{background:#ffd0d0;animation:throb .5s ease-in-out infinite alternate}
.pill.time.battle{min-width:104px;font-size:30px}
@keyframes throb{from{transform:scale(1)}to{transform:scale(1.07)}}
.btns{display:flex;gap:6px}
.ibtn{pointer-events:auto;width:44px;height:44px;border-radius:15px;border:3px solid var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;padding:0;color:var(--textDark)}
.ibtn.dark{background:var(--space2);color:var(--text)}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.goal{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:7px 10px 9px;display:flex;flex-direction:column;gap:6px}
.goal .gh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl{font:600 12px var(--tech);letter-spacing:.16em;text-transform:uppercase}
.goal .gh .lbl{color:var(--textDark)} .goal .gh small{font:900 12px var(--round);color:var(--sub)}
.goal .bar{position:relative;height:14px;border-radius:8px;background:#e7e1f3;border:2.5px solid var(--ink);overflow:hidden}
.goal .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#9cf06a,#5fcf3b);transition:width .3s}
.goal.ready{background:#fff3b8;animation:throb .45s ease-in-out infinite alternate}
.goal.ready .fill{background:linear-gradient(#ffe07a,#ffb21f)}
.goal .boss{display:flex;align-items:center;gap:8px}
.goal .boss img{width:44px;height:44px;flex-shrink:0;margin:-4px 0}
.goal .boss .bi{flex:1;display:flex;flex-direction:column;gap:5px}
.goal .hearts{color:#ff4f7b;letter-spacing:3px;font-size:19px}
.goal .hearts i{color:rgba(43,33,64,.22);font-style:normal}
.goal .boss .bt{display:flex;justify-content:space-between;font:900 15px var(--round)} .goal .boss .bt b{font:700 16px var(--tech)}
.chips{display:flex;gap:6px}
/* «Наводка», уровень 0 (06.10): три урока пилюлями — пройденные с галочкой, текущий жёлтый */
.goal .tsteps{display:flex;gap:6px} .goal .tsteps span{flex:1;text-align:center;padding:4px 2px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;font:900 13px var(--round);color:var(--sub)}
.goal .tsteps span.cur{background:#fff3b8;color:var(--textDark)} .goal .tsteps span.done{background:#dcffc0;color:#2f8f45}
/* «Наводка», заказы по очереди (06.10): текущий — крупно со счётом и полоской, очередь — значками (готовые с галочкой) */
.goal .oq{display:flex;gap:5px;align-items:center;justify-content:flex-end}
.goal .oq span{position:relative;width:26px;height:26px;border-radius:9px;border:2px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center}
.goal .oq span img{width:24px;height:24px;margin:0} .goal .oq span.cur{background:#fff3b8;transform:scale(1.15)} .goal .oq span.todo{opacity:.45}
.goal .oq span.done{background:#dcffc0} .goal .oq span.done::after{content:'✓';position:absolute;right:-5px;bottom:-6px;font:900 13px var(--round);color:#2f8f45;-webkit-text-stroke:3px #fff;paint-order:stroke fill}
.goal .boss .bt small{font:800 12px var(--round);color:var(--sub);margin-left:4px}
.goal.pop{animation:goalPop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes goalPop{0%{transform:scale(.88)}100%{transform:scale(1)}}
.chip{flex:1 1 0;display:flex;align-items:center;gap:4px;height:44px;padding:0 6px 0 2px;border-radius:15px;border:2.5px solid var(--ink);background:#fff;min-width:0}
.chip img{width:38px;height:38px;flex-shrink:0}
.chip .cv{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.chip .cv b{font:700 15px var(--tech);color:var(--textDark);line-height:1}
.chip .mini{height:6px;border-radius:4px;background:#e7e1f3;overflow:hidden} .chip .mini i{display:block;height:100%;background:var(--orange)}
.chip.done{background:#dcffc0} .chip.done .mini i{background:var(--limeD)}
.chip.pulse{animation:pop .35s ease-out}
.slots{display:flex;gap:6px;align-items:center}
.slot{width:46px;height:46px;border-radius:14px;border:3px solid var(--ink);background:#efe9fb;display:flex;align-items:center;justify-content:center;overflow:hidden;font:900 20px var(--round);color:#c9bfe3}
.slot.on{background:radial-gradient(circle at 50% 35%,#fff3b0 0%,#ffc21a 70%)} .slot img{width:42px;height:42px}
.dots{display:flex;gap:4px;flex-wrap:wrap} .dot{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--ink);background:#efe9fb} .dot.on{background:var(--lime2)}
#next{align-self:center;max-width:100%;display:flex;align-items:center;gap:6px;padding:5px 12px 5px 8px;border-radius:14px;background:rgba(43,33,64,.82);color:#fff;font:800 13px var(--round);text-align:center}
#next:empty{display:none}
#next.rule{background:var(--pink);border:2.5px solid var(--ink)}
/* «Наводка»: лестница ступеней тарелки (06.10) — кого на какой ступени можно брать */
/* «Наводка»: крупные события — строкой под карточкой цели, а не поперёк поля (06.10, Андрей: «надписи сильно заслоняют экран») */
#ann{align-self:center;display:none;align-items:center;justify-content:center;flex-wrap:wrap;row-gap:0;gap:0 7px;max-width:calc(100% - 20px);padding:5px 14px;border-radius:14px;background:rgba(43,33,64,.9);
  color:#fff;font:800 14px var(--round);white-space:nowrap}
#ann b{font:900 18px var(--round);letter-spacing:.02em}
#ann.on{display:flex;animation:annPop .32s cubic-bezier(.3,1.6,.5,1)}
#ann.off{display:flex;opacity:0;transition:opacity .25s}
@keyframes annPop{0%{transform:scale(.55);opacity:0}100%{transform:scale(1);opacity:1}}
/* «Наводка»: плашка обучения внизу экрана (сверху она закрывала цели уроков) */
#tutp{position:absolute;z-index:8;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100% - 28px);pointer-events:none;
  background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:7px 14px 9px;
  font:900 19px/1.25 var(--round);color:var(--textDark);text-align:center;transition:opacity .25s, transform .25s}
#tutp.pop{animation:tutPop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes tutPop{0%{transform:translateX(-50%) scale(.85)}100%{transform:translateX(-50%) scale(1)}}
#tutp small{display:block;font:800 11.5px var(--round);letter-spacing:.08em;text-transform:uppercase;color:#7a5cf0;margin-bottom:2px}
#tutp.ok{border-color:#2f8f45;box-shadow:0 4px 0 #2f8f45}
#tutp.ok small{color:#2f8f45}
#tutp.hide{display:none}
body.tut-on #toast{display:none}
/* «Наводка»: карточка угрозы при первой встрече (06.10) — игра стоит, камера на угрозе: кто это, что делает, как быть */
#thr{position:absolute;z-index:20;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;padding:0 14px;pointer-events:none}
#thr.hide{display:none}
#thr .thr-card{pointer-events:auto;width:100%;max-width:400px;display:grid;grid-template-columns:78px 1fr;gap:10px 12px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:22px;
  box-shadow:0 5px 0 var(--ink);padding:12px 14px 14px;color:var(--textDark);animation:thrIn .34s cubic-bezier(.3,1.5,.5,1)}
#thr .thr-ph{width:78px;height:78px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#fff2d6 0%,#e9c79a 75%);border:3px solid var(--ink)}
#thr .thr-ph img,#thr .thr-ph svg{width:92%;height:92%}
#thr .thr-tx{min-width:0}
#thr small{display:block;font:800 11px var(--round);letter-spacing:.08em;text-transform:uppercase;color:var(--danger)}
#thr b{display:block;font:900 21px/1.1 var(--round);margin-top:1px}
#thr p{margin:4px 0 0;font:700 14px/1.3 var(--round);color:var(--sub)}
#thr p.how{color:var(--textDark)} #thr p.how::before{content:'→ ';color:#2f8f45;font-weight:900}
#thr .bigbtn{grid-column:1 / -1;height:54px;font-size:20px}
@keyframes thrIn{0%{transform:translateY(40px) scale(.92);opacity:0}100%{transform:none;opacity:1}}
/* битва: таблица мест и лента событий */
.board{align-self:flex-end;width:150px;padding:5px;border-radius:17px;background:rgba(20,11,51,.84);border:3px solid var(--ink);display:flex;flex-direction:column;gap:2px;color:#fff}
.board:empty{display:none}
.board .r{display:flex;align-items:center;gap:6px;height:28px;padding:0 7px;border-radius:10px;border:2.5px solid transparent;font:900 13.5px var(--round)}
.board .r.me{background:var(--orange);border-color:var(--ink)}
.board .r .p{font:700 13px var(--tech);width:11px;color:var(--muted)} .board .r.me .p{color:#fff}
.board .r .c{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);flex-shrink:0}
.board .r .nm{flex:1;overflow:hidden;text-overflow:ellipsis} .board .r .sc{font:600 14px var(--tech)}
.board .r.dead{opacity:.55}
#feedbox{position:absolute;left:10px;top:calc(122px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:5px;max-width:calc(100% - 180px);pointer-events:none}
.fd{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:13px;background:rgba(20,11,51,.84);border:2.5px solid var(--ink);color:#fff;font:800 12.5px var(--round);line-height:1.25;animation:pop .22s ease-out}
.fd i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);flex-shrink:0}
/* баннер «теперь можно» и тост. z-index 8: поверх экранов меню (#overlay; внутри экранов z-index до 4, иначе тост прячется под
   нижней навигацией и самим оверлеем), но под дев-панелью (9). В партии оверлея нет, там порядок слоёв тот же, что был по DOM */
#banner{position:absolute;z-index:8;left:50%;top:27%;transform:translate(-50%,0) scale(1);background:var(--paper);border:4px solid var(--ink);border-radius:22px;
  box-shadow:0 6px 0 var(--ink);padding:10px 18px;font:900 21px var(--round);text-align:center;pointer-events:none;white-space:normal;width:max-content;max-width:calc(100% - 32px);color:var(--textDark);
  transition:opacity .25s, transform .25s;opacity:1}
#banner.hide{opacity:0;transform:translate(-50%,-10px) scale(.96)}
#banner small{display:block;font:800 14px var(--round);color:var(--sub);margin-top:2px}
#toast{position:absolute;z-index:8;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(43,33,64,.9);color:#fff;
  padding:9px 15px;border-radius:15px;pointer-events:none;opacity:.98;transition:opacity .25s;font:800 15px var(--round);text-align:center;max-width:90%}
#toast.hide{opacity:0}
/* --- экраны: DOM-оверлеи на весь кадр (§9) --- */
#overlay{position:absolute;inset:0;display:none;background:rgba(20,11,51,.55)}
#overlay.show{display:block}
#scr{position:absolute;inset:0;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));animation:fade .2s ease-out}
.scr.space{background:radial-gradient(ellipse at 50% 0%,#2a1a6a 0%,#160c3a 55%,#0d0726 100%)}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@keyframes pop{from{transform:scale(.94)}to{transform:scale(1)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulseRing{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.12);opacity:.5}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
#hud-n.bump{display:inline-block;animation:bump .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.7)}100%{transform:scale(1)}}
.stars-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.stars-bg i{position:absolute;border-radius:50%;background:#fff}
.glow{position:absolute;border-radius:50%;pointer-events:none}
.topbar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;z-index:2}
.topbar .tl{display:flex;align-items:center;gap:10px;min-width:0}
.gpill{display:flex;align-items:center;gap:6px;height:42px;padding:0 13px 0 6px;background:var(--space2);border:3px solid var(--ink);border-radius:21px;box-shadow:0 4px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.12);color:#fff;font:600 20px var(--tech)}
.title{font:900 30px/1.02 var(--round);color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--pink);letter-spacing:.01em;text-wrap:balance}
.title.sm{font-size:25px;-webkit-text-stroke-width:5px;text-shadow:0 3px 0 var(--violet,#9a62f0)}
.tlabel{font:600 13px var(--tech);letter-spacing:.18em;text-transform:uppercase;color:var(--lime)}
.bigbtn{width:100%;height:64px;border:3px solid var(--ink);border-radius:20px;background:linear-gradient(180deg,#d2ff8a 0%,var(--lime) 45%,var(--lime2) 100%);
  box-shadow:0 6px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(23,61,5,.18);color:var(--limeInk);font:900 24px var(--round);letter-spacing:.04em;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.bigbtn small{font:600 12px var(--tech);letter-spacing:.14em;color:#2f6a12;margin-top:1px}
.bigbtn:active,.btn2:active,.buy:active,.node:active{transform:translateY(3px)}
.btn2{height:54px;border:3px solid var(--ink);border-radius:18px;background:var(--paper2);box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.7);color:var(--textDark);font:900 17px var(--round);letter-spacing:.03em;text-transform:uppercase;padding:0 14px}
.link{background:none;border:0;color:var(--lime);font:800 15px var(--round);padding:8px;align-self:center}
.row2{display:flex;gap:10px}
.panel{border:3px solid var(--ink);border-radius:22px;background:var(--panel);box-shadow:0 5px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.12)}
.paper{border:3px solid var(--ink);border-radius:22px;background:var(--paper);box-shadow:0 5px 0 var(--ink);color:var(--textDark)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1;min-height:0}
.scroll::-webkit-scrollbar{display:none}
/* нижняя навигация */
.nav{position:relative;z-index:3;display:flex;gap:4px;align-items:center;height:74px;padding:6px;margin-top:10px;background:var(--space2);border:3px solid var(--ink);border-radius:26px;box-shadow:0 5px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.1);flex-shrink:0}
.nav button{position:relative;flex:1 1 0;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:18px;background:none;color:var(--muted);font:900 11.5px var(--round);padding:0}
.nav button.on{background:var(--lime);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:var(--limeInk);transform:translateY(-8px)}
.nav .badge{position:absolute;top:2px;right:16%;min-width:18px;height:18px;border-radius:9px;background:var(--pink);border:2px solid var(--ink);color:#fff;font:700 11px var(--tech);display:flex;align-items:center;justify-content:center}
/* карта операций */
/* «Наводка»: своё главное меню (06.10) — название, тарелка уносит корову, три операции карточками */
.amenu .logo{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:2px}
.amenu .logo .title{font-size:44px;color:var(--lime);-webkit-text-stroke-width:7px;letter-spacing:.02em}
.amenu .ahero{position:relative;height:150px;flex-shrink:0;z-index:1}
.amenu .ahero .ufo{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:2} .amenu .ahero .ufo>div{animation:hover 2.4s ease-in-out infinite}

// Детерминированный генератор (PROTO-BASE §5). Math.random() не используется.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const ECON = {

  WIN_STEP: 4,            // + за каждую следующую операцию: 20 + 4·(n − 1)
  REPLAY_K: 0.5,          // повторная победа — доля первой
  STAR: [10, 15],         // новая звезда: глава 1 / глава 2

  AVG_STARS: 2,           // средний игрок: звёзд за операцию
  BATTLE_EVERY: 2,        // средний игрок: битва раз в столько операций
  AVG_BATTLE: 30,         // средний игрок: кристаллов за битву

const CH2 = 8;                                         // индекс первой операции главы 2 (05.10: был 9 — убран Птичий двор)
function chapterOf(li){ return li >= CH2 ? 2 : 1; }
function winGems(li, first){ const g = ECON.WIN0 + ECON.WIN_STEP * li; return first ? g : Math.round(g * ECON.REPLAY_K); }
function starGems(li){ return ECON.STAR[chapterOf(li) - 1]; }
function bossGems(li){ return ECON.BOSS[chapterOf(li) - 1]; }
// Сколько кристаллов у среднего игрока к операции li: первые победы, AVG_STARS звёзд, главные цели, первые виды, битва раз в BATTLE_EVERY операций.
function expectedGems(li){
  let g = 0; const seen = new Set();
  for (let i = 0; i < li && i < LEVELS.length; i++){
    const L = LEVELS[i]; g += winGems(i, true) + ECON.AVG_STARS * starGems(i) + (L.boss ? bossGems(i) : 0);
    for (const sp of levelSpecies(L)) if (!seen.has(sp)){ seen.add(sp); g += ECON.FIRST; }
    if ((i + 1) % ECON.BATTLE_EVERY === 0) g += ECON.AVG_BATTLE;

}
// Ожидаемая прокачка к операции li: доход тратится жадно — дешевле и важнее раньше (вес — цена × приоритет). extra — доплата (фарм).

    for (const k in UP_PRIO){ const c = upCost(k, up[k] || 0); if (c && c * UP_PRIO[k] < bw){ bw = c * UP_PRIO[k]; best = k; } }
    const c = best ? upCost(best, up[best] || 0) : 0; if (!best || c > gems) break;

// cut — это разрез строя: его гасит силовое поле (прокачка), тогда возвращает −1 и никто не отрывается.
function looseAliens(s, k, fx, fz, q, cut){
  q = q || s;
  k = Math.max(CFG.CUT_KEEP, k); if (k >= q.n) return 0;
  if (cut && q.shield > 0){ q.shield--; emit(s, 'shield', { x: fx, z: fz, q: q.id, left: q.shield }); return -1; }
  const lost = q.n - k, wait = q === s ? s.strayT : CFG.STRAY_T;
  for (let j = k; j < q.n; j++){
    const x = q.al[j * 2], z = q.al[j * 2 + 1], d = Math.hypot(x - fx, z - fz) || 1, a = (s.rnd() - 0.5) * 1.4;
    const ux = (x - fx) / d, uz = (z - fz) / d, rx = ux * Math.cos(a) - uz * Math.sin(a), rz = ux * Math.sin(a) + uz * Math.cos(a), sp = CFG.STRAY_SPEED * (0.6 + 0.4 * s.rnd());
    s.strays.push({ id: s.nextStray++, owner: q.id, x, z, vx: rx * sp, vz: rz * sp, t0: s.t, until: s.t + wait });
  }
  q.n = k; if (q === s) s.lostTotal += lost; q.cutsTaken += cut ? 1 : 0; updateAliens(q);
  while (s.strays.length > CFG.STRAY_MAX){ const o = s.strays.shift(); if (o.owner === s.id) s.strayLost++; emit(s, 'strayLost', { id: o.id, x: o.x, z: o.z }); }
  return lost;
}
// Генерал врезался: отброс от точки (fx, fz) и потеря HIT_LOSS с хвоста (не чаще HIT_CD).
function hitLeader(s, fx, fz, by, knock, q){
  q = q || s;
  const Ld = q.leader, dx = Ld.x - fx, dz = Ld.z - fz, d = Math.hypot(dx, dz) || 1;
  if (knock){ Ld.vx = dx / d * CFG.KNOCK; Ld.vz = dz / d * CFG.KNOCK; }
  if (s.t < q.hitCdUntil) return;
  q.hitCdUntil = s.t + CFG.HIT_CD;
  const lost = Math.max(0, q.crew ? knockAliens(s, q, crewNearest(q, Ld.x, Ld.z, CFG.HIT_LOSS), Ld.x, Ld.z, false) : looseAliens(s, q.n - CFG.HIT_LOSS, Ld.x, Ld.z, q, false));
  emit(s, by === 'fence' ? 'zap' : 'hit', { by, lost, x: Ld.x, z: Ld.z, q: q.id });
}
function stepHazards(s){
  const dt = CFG.DT, Ld = s.leader;
  for (const T of s.tractors){
    if (s.t >= T.pauseUntil){
      const k = T.axis === 'x' ? 'x' : 'z'; let p = T[k] + T.dir * T.speed * dt;
      if (p > T.max){ p = T.max; T.dir = -1; T.pauseUntil = s.t + CFG.TRACTOR_PAUSE; }
      else if (p < T.min){ p = T.min; T.dir = 1; T.pauseUntil = s.t + CFG.TRACTOR_PAUSE; }
      T[k] = p;
    }
    if (!s.fly && tractorHit(T, Ld.x, Ld.z, CFG.ALIEN_R)){            // генерал под трактором: вытолкнуть вбок от колеи (тарелка — над ним)
      const side = T.axis === 'x' ? Ld.z - T.z : Ld.x - T.x, sg = side >= 0 ? 1 : -1, edge = CFG.TRACTOR_HW + CFG.ALIEN_R + 0.02;
      if (T.axis === 'x') Ld.z = T.z + sg * edge; else Ld.x = T.x + sg * edge;
      hitLeader(s, T.axis === 'x' ? Ld.x : T.x, T.axis === 'x' ? T.z : Ld.z, 'tractor', true);
    }
    if (!s.fly && s.t - T.honkT > CFG.HONK_CD && s.t >= T.pauseUntil){       // сигнал: строй впереди по ходу
      for (let i = 0; i < s.n; i++){
        const ax = s.al[i * 2] - T.x, az = s.al[i * 2 + 1] - T.z, along = (T.axis === 'x' ? ax : az) * T.dir, side = T.axis === 'x' ? az : ax;
        if (along > 0 && along < CFG.TRACTOR_HL + CFG.HONK_R && Math.abs(side) < CFG.TRACTOR_HW + 0.6){ T.honkT = s.t; emit(s, 'honk', { x: T.x, z: T.z }); break; }
      }
    }
  }
  for (const C of s.chasers){
    const dL = Math.hypot(Ld.x - C.x, Ld.z - C.z);
    let tvx = 0, tvz = 0;
    if (C.mode === 'cheer'){ if (s.t >= C.until){ C.mode = 'tired'; C.until = s.t + CFG.TIRED_T; } }
    else if (C.mode === 'tired'){ if (s.t >= C.until) C.mode = 'walk'; else { tvx = C.wx * CFG.CHASER_WALK * 0.5; tvz = C.wz * CFG.CHASER_WALK * 0.5; } }
    else if (C.mode === 'walk'){
      if (dL < CFG.CHASE_R && s.n >= s.start + CFG.CHASE_MIN_ADD && !s.won && !s.fly){ C.mode = 'chase'; C.chaseT0 = s.t; emit(s, 'alert', { x: C.x, z: C.z }); }
      else {
        if (s.t >= C.nextT){ const a = s.rnd() * 6.283; C.wx = Math.cos(a); C.wz = Math.sin(a); C.nextT = s.t + 1.5 + s.rnd() * 2; }
        tvx = C.wx * CFG.CHASER_WALK; tvz = C.wz * CFG.CHASER_WALK;
      }
    }
    if (C.mode === 'chase'){
      if (dL > CFG.CHASE_R * 1.6 || s.won){ C.mode = 'walk'; }
      else if (s.t - C.chaseT0 > CFG.CHASE_T){ C.mode = 'tired'; C.until = s.t + CFG.TIRED_T; emit(s, 'tired', { x: C.x, z: C.z }); }
      else {                                                  // бежит к ближайшему пришельцу строя (не к генералу) — режет хвост
        let bi = -1, bd = 1e9; for (let i = 1; i < s.n; i++){ const d = Math.hypot(s.al[i * 2] - C.x, s.al[i * 2 + 1] - C.z); if (d < bd){ bd = d; bi = i; } }
        const tx = bi > 0 ? s.al[bi * 2] : Ld.x, tz = bi > 0 ? s.al[bi * 2 + 1] : Ld.z, d = Math.hypot(tx - C.x, tz - C.z) || 1;
        tvx = (tx - C.x) / d * C.spd; tvz = (tz - C.z) / d * C.spd;
      }
    }
    const kk = Math.min(1, 8 * dt); C.vx += (tvx - C.vx) * kk; C.vz += (tvz - C.vz) * kk;
    C.x = clamp(C.x + C.vx * dt, -s.FX + 0.6, s.FX - 0.6); C.z = clamp(C.z + C.vz * dt, -s.FZ + 0.6, s.FZ - 0.6);
    for (const f of s.fences){ const q = segClosest(C.x, C.z, f.ax, f.az, f.bx, f.bz), dx = C.x - q.x, dz = C.z - q.z, d = Math.hypot(dx, dz), m = CFG.CHASER_R + CFG.FENCE_R;
      if (d < m && d > 1e-6){ C.x = q.x + dx / d * m; C.z = q.z + dz / d * m; } }
    if (s.oasis) pondPush(s.oasis, C, CFG.CHASER_R);                       // сторож по воде не ходит
    const v2 = C.vx * C.vx + C.vz * C.vz; if (v2 > 0.04){ const v = Math.sqrt(v2); C.hx = C.vx / v; C.hz = C.vz / v; }
    if (!s.fly && C.mode !== 'cheer' && C.mode !== 'tired' && dL < CFG.CHASER_R + CFG.ALIEN_R){
      const nx = (Ld.x - C.x) / (dL || 1), nz = (Ld.z - C.z) / (dL || 1), m = CFG.CHASER_R + CFG.ALIEN_R + 0.02;
      Ld.x = C.x + nx * m; Ld.z = C.z + nz * m;
      hitLeader(s, C.x, C.z, 'chaser', true);
      C.mode = 'cheer'; C.until = s.t + CFG.CHASER_CD;
    }
  }
  if (!s.fly) for (const f of s.fences){                    // электропастух: стена под током (тарелка — над ним)
    const q = segClosest(Ld.x, Ld.z, f.ax, f.az, f.bx, f.bz), dx = Ld.x - q.x, dz = Ld.z - q.z, d = Math.hypot(dx, dz), m = CFG.FENCE_R + CFG.ALIEN_R;
    if (d < m){
      const nx = d > 1e-6 ? dx / d : 0, nz = d > 1e-6 ? dz / d : 1;
      Ld.x = q.x + nx * m; Ld.z = q.z + nz * m;
      const vn = Ld.vx * nx + Ld.vz * nz; if (vn < 0){ Ld.vx -= vn * nx; Ld.vz -= vn * nz; }
      hitLeader(s, q.x, q.z, 'fence', false);
    }
  }
}
// Трактор и сторож режут строй: всё от точки касания до хвоста отрывается.
function cutChain(s){
  if (s.crew) return pileCuts(s);                                 // «Куча-мала»: не режут, а раскидывают
  for (const T of s.tractors){
    if (s.t - T.cutT < CFG.TRACTOR_CUT_CD) continue;
    for (let i = 1; i < s.n; i++) if (tractorHit(T, s.al[i * 2], s.al[i * 2 + 1], CFG.ALIEN_R)){
      const x = s.al[i * 2], z = s.al[i * 2 + 1], lost = looseAliens(s, i, T.x, T.z, s, true);
      if (lost !== 0){ T.cutT = s.t; if (lost > 0){ s.cuts++; emit(s, 'cut', { by: 'tractor', lost, x, z, n: s.n, q: 0 }); } }
      break;
    }
  }
  for (const C of s.chasers){
    if (C.mode === 'cheer' || C.mode === 'tired') continue;
    for (let i = 1; i < s.n; i++){
      const x = s.al[i * 2], z = s.al[i * 2 + 1];
      if (Math.hypot(x - C.x, z - C.z) >= CFG.CHASER_R + CFG.ALIEN_R) continue;
      const lost = looseAliens(s, i, C.x, C.z, s, true);
      if (lost > 0){ s.cuts++; emit(s, 'cut', { by: 'chaser', lost, x, z, n: s.n, q: 0 }); }
      C.mode = 'cheer'; C.until = s.t + CFG.CHASER_CD;
      break;
    }
  }
}
// Прожектор (ночная ферма): пятно ходит дугой вокруг вышки туда-обратно. Попал в пятно — строй рассыпается.
function lightPos(Lt, t){
  const u = (1 - Math.cos(2 * Math.PI * (t + Lt.t0) / Lt.period)) / 2, v = (1 - Math.cos(2 * Math.PI * (t + Lt.t0) / (Lt.period * 0.71))) / 2;
  const a = Lt.a0 + (Lt.a1 - Lt.a0) * u, R = Lt.r0 + (Lt.r1 - Lt.r0) * v;
  return { x: Lt.x + Math.cos(a) * R, z: Lt.z + Math.sin(a) * R };
}
function stepLights(s){
  const dt = CFG.DT;
  for (const Lt of s.lights){
    const p = lightPos(Lt, s.t); Lt.px = p.x; Lt.pz = p.z;
    if (s.won || s.lost) continue;
    if (s.aim){ aimLightStep(s, Lt, p); continue; }                  // «Наводка»: прожектор ловит луч, а не строй
    // кто в пятне: генерал или первый задетый пришелец строя (любого отряда)
    let hitQ = null, hitI = -1;
    for (const q of s.squads){
      if (!q.alive) continue;
      const Ld = q.leader, dl = Math.hypot(Ld.x - p.x, Ld.z - p.z);
      if (q === s && dl - Lt.r < CFG.LIGHT_WARN && s.t >= Lt.warnT){ Lt.warnT = s.t + 2.5; emit(s, 'lightNear', { x: p.x, z: p.z }); }
      if (dl < Lt.r){ hitQ = q; hitI = 0; break; }
      for (let i = 1; i < q.n; i++) if (Math.hypot(q.al[i * 2] - p.x, q.al[i * 2 + 1] - p.z) < Lt.r){ hitQ = q; hitI = i; break; }
      if (hitQ) break;
    }
    // тревога копится, пока строй в свете, и спадает, когда ушёл: успел увести — разреза нет
    if (hitQ){ if (Lt.alarm === 0) emit(s, 'lightSpot', { x: p.x, z: p.z, q: hitQ.id }); Lt.alarm += dt; }
    else Lt.alarm = Math.max(0, Lt.alarm - dt * CFG.LIGHT_DECAY);
    if (!hitQ || Lt.alarm < CFG.LIGHT_ALARM || s.t - Lt.cutT < CFG.LIGHT_CD) continue;
    Lt.alarm = 0; Lt.cutT = s.t;
    if (hitI === 0){ hitLeader(s, p.x, p.z, 'light', false, hitQ); continue; }
    const x = hitQ.al[hitI * 2], z = hitQ.al[hitI * 2 + 1], lost = hitQ.crew ? knockAliens(s, hitQ, crewNear(hitQ, p.x, p.z, Lt.r), p.x, p.z, true) : looseAliens(s, hitI, p.x, p.z, hitQ, true);
    if (lost > 0){ if (hitQ === s) s.cuts++; emit(s, 'cut', { by: 'light', lost, x, z, n: hitQ.n, q: hitQ.id }); }
  }
}
// Смерч (буря): бродит по полю, тянет зверей в хоровод и режет строй ядром; потом стихает — звери кружатся кучей на месте.
function spawnTornado(s, T, far){
  let x = 0, z = 0;
  for (let tries = 0; tries < 30; tries++){
    x = (s.rnd() * 2 - 1) * (s.FX - 4); z = (s.rnd() * 2 - 1) * (s.FZ - 4);
    if (s.squads.every(q => !q.alive || Math.hypot(x - q.leader.x, z - q.leader.z) > far)) break;
  }
  T.x = x; T.z = z; T.vx = 0; T.vz = 0; T.tx = x; T.tz = z; T.state = 'spin'; T.until = s.t + T.life[0] + s.rnd() * (T.life[1] - T.life[0]); T.nextT = 0; T.cutT = -9;
}
function stepTornados(s){
  const dt = CFG.DT;
  for (const T of s.tornados){
    if (T.state === 'calm'){ if (s.t >= T.until && !s.won && !s.lost){ spawnTornado(s, T, 9); emit(s, 'tornadoForm', { x: T.x, z: T.z }); } continue; }
    if (s.t >= T.until){
      T.state = 'calm'; T.until = s.t + T.calm; let n = 0;
      for (const a of s.animals) if (a.state === 'free' && !a.boss && Math.hypot(a.x - T.x, a.z - T.z) < T.pull){ a.dizzyUntil = s.t + CFG.DIZZY_T; n++; }
      emit(s, 'tornadoCalm', { x: T.x, z: T.z, n }); continue;
    }
    if (s.t >= T.nextT || Math.hypot(T.tx - T.x, T.tz - T.z) < 1){ T.tx = (s.rnd() * 2 - 1) * (s.FX - 4); T.tz = (s.rnd() * 2 - 1) * (s.FZ - 4); T.nextT = s.t + 3 + s.rnd() * 2; }
    const dx = T.tx - T.x, dz = T.tz - T.z, d = Math.hypot(dx, dz) || 1, kk = Math.min(1, 1.5 * dt);
    T.vx += (dx / d * T.speed - T.vx) * kk; T.vz += (dz / d * T.speed - T.vz) * kk;
    T.x = clamp(T.x + T.vx * dt, -s.FX + 2, s.FX - 2); T.z = clamp(T.z + T.vz * dt, -s.FZ + 2, s.FZ - 2);
    if (s.won || s.lost) continue;
    for (const q of s.squads){
      if (!q.alive) continue;
      const Ld = q.leader;
      if (Math.hypot(Ld.x - T.x, Ld.z - T.z) < CFG.TORNADO_EYE + CFG.ALIEN_R) hitLeader(s, T.x, T.z, 'tornado', true, q);
      if (s.t - T.cutT < CFG.TORNADO_CD) continue;
      for (let i = 1; i < q.n; i++){
        const x = q.al[i * 2], z = q.al[i * 2 + 1];
        if (Math.hypot(x - T.x, z - T.z) >= CFG.TORNADO_EYE) continue;
        const lost = q.crew ? knockAliens(s, q, crewNear(q, T.x, T.z, CFG.TORNADO_EYE), T.x, T.z, true) : looseAliens(s, i, T.x, T.z, q, true);
        if (lost !== 0){ T.cutT = s.t; if (lost > 0){ if (q === s) s.cuts++; emit(s, 'cut', { by: 'tornado', lost, x, z, n: q.n, q: q.id }); } }
        break;
      }
    }
  }
}
// --- глава 2, правила 2b: лёд и песчаная буря (данные — L.ice, L.sandstorm; без них всё ниже ничего не делает) ---
// Лёд (операция 10): льдины — эллипсы { x, z, r, rz? } на снегу. На льдине генерал разгоняется и тормозит плавно, испуганные звери
// скользят юзом; на снегу между льдинами всё как всегда. Главная цель, стоящая на льдине, своей льдины и держится (морж «на льдине»).
function floeAt(s, x, z, pad){
  const I = s.ice; if (!I) return null; pad = pad || 0;
  for (const f of I.floes){ const u = (x - f.x) / (f.r + pad), v = (z - f.z) / ((f.rz || f.r) + pad); if (u * u + v * v <= 1) return f; }
  return null;
}
// Скорость генерала на льдине: шаг руления как на снегу, но не больше полной скорости за ICE_INERTIA секунд. Вне льда — false.
function iceSteer(s, q, dvx, dvz, k, cap){
  const Ld = q.leader;
  if (!(CFG.ICE_INERTIA > 0) || !floeAt(s, Ld.x, Ld.z)) return false;
  let ax = (dvx - Ld.vx) * k, az = (dvz - Ld.vz) * k;
  const m = Math.hypot(ax, az), lim = cap / CFG.ICE_INERTIA * CFG.DT;
  if (m > lim){ ax *= lim / m; az *= lim / m; }
  Ld.vx += ax; Ld.vz += az;
  return true;
}
// Руление зверя на льду (доля шага к желаемой скорости): испуг — как всегда (отскок резкий); испугался на льдине — потом скользит:
// скорость гаснет медленно, пока не встанет или не съедет на снег. a.slide: 1 — испуган на льду, 2 — скользит.
function iceGrip(s, a){
  const k = Math.min(1, CFG.STEER_A * CFG.DT);
  if (a.spookUntil > s.t){ if (floeAt(s, a.x, a.z)) a.slide = 1; return k; }
  if (!a.slide) return k;
  if (Math.hypot(a.vx, a.vz) < CFG.ICE_SLIDE_MIN || !floeAt(s, a.x, a.z)){ a.slide = 0; return k; }
  if (a.slide === 1){ a.slide = 2; emit(s, 'slide', { id: a.id, x: a.x, z: a.z }); }
  a.mode = 'slide';
  return Math.min(1, CFG.ICE_SLIDE * CFG.DT);
}
function stepIce(s){
  const I = s.ice; if (!I) return;
  if (!I.homed){                                    // главная цель на льдине: дом — её льдина (иначе за минуту уйдёт на снег)
    I.homed = true;
    const b = s.bossId ? s.animals.find(a => a.id === s.bossId) : null, f = b && floeAt(s, b.x, b.z);
    if (f && !b.home) b.home = { x: f.x, z: f.z, sp: b.sp, R: Math.max(0.6, Math.min(f.r, f.rz || f.r) - b.r - 0.6) };
  }
  const Ld = s.leader, on = !!floeAt(s, Ld.x, Ld.z);
  if (on && !I.on && s.t - I.onT > 1.2 && !s.won && !s.lost){ I.onT = s.t; emit(s, 'iceOn', { x: Ld.x, z: Ld.z }); }
  I.on = on;
}
// Песчаная буря (операция 16): затишье → предупреждение (warn с: песчаные полосы бегут по ветру — направление видно заранее) →
// порыв (gust с: сносит генерала и зверей, видимость падает) → затишье. Сила порыва k (0…1) нарастает и спадает за SAND_RAMP.
// Направление и длительности — свой генератор от сида уровня: буря не зависит от того, как бродят звери.
function windInit(s, C){
  const rnd = mulberry32(9100 + (s.L.seed || s.L.n || 0) * 131 + (s.ws || 0) * 7919);
  return { calm: C.calm || [7, 10], warn: C.warn === undefined ? 2.5 : C.warn, gust: C.gust || [3.5, 5], push: C.push === undefined ? 1 : C.push,
    phase: 'calm', t0: 0, until: C.first === undefined ? 5 : C.first, dx: 1, dz: 0, k: 0, n: 0, rnd };
}
function stepWind(s){
  const W = s.wind; if (!W) return;
  const end = s.won || s.lost;
  if (end && W.phase !== 'calm'){ W.phase = 'calm'; W.t0 = s.t; W.until = Infinity; }   // партия кончилась — буря стихает и больше не начинается
  if (s.t >= W.until && !end){
    if (W.phase === 'calm'){
      const a = W.rnd() * Math.PI * 2; W.dx = Math.cos(a); W.dz = Math.sin(a);
      W.phase = 'warn'; W.t0 = s.t; W.until = s.t + W.warn; W.n++;
      emit(s, 'gustWarn', { dx: W.dx, dz: W.dz, at: W.until });
    } else if (W.phase === 'warn'){
      W.phase = 'gust'; W.t0 = s.t; W.until = s.t + W.gust[0] + W.rnd() * (W.gust[1] - W.gust[0]);
      emit(s, 'gust', { dx: W.dx, dz: W.dz, until: W.until });
    } else {
      W.phase = 'calm'; W.t0 = s.t; W.until = s.t + W.calm[0] + W.rnd() * (W.calm[1] - W.calm[0]);
      emit(s, 'gustEnd', {});
    }
  }
  const tg = W.phase === 'gust' && !end ? 1 : 0, r = CFG.DT / CFG.SAND_RAMP;

      if (a.rfull < 0){ a.rfull = t; emit(s, 'ringFull', { id: a.id, need: a.need, hold: holdT(a), x: a.x, z: a.z, q: q.id }); }
      else if (t - a.rfull >= holdT(a)) liftRing(s, q, a);
      continue;
    }
    if (a.rfull >= 0){ a.rfull = -1; a.rt0 = t; emit(s, 'ringBreak', { id: a.id, x: a.x, z: a.z, q: q.id }); }   // кого-то выбили — держать заново
    if (t - a.rt0 > P.GIVEUP_T) releaseRing(s, q, a, 'slow');
    else if (Math.hypot(a.x - Ld.x, a.z - Ld.z) - a.r > P.LEASH) releaseRing(s, q, a, 'leash');
  }
}
// Кружок выдержал: зверь уходит в тарелку — то же похищение (close), что у кольца; кружок держится, пока луч поднимает.
function liftRing(s, q, a){
  const P = CFG.PILE, K = q === s ? (s.capK || 1) : 1, C = q.crew, ai = [], loop = [];
  for (let i = 1; i < q.n; i++){ const c = C[i]; if (c.m === PM.RING && c.tid === a.id){ c.m = PM.CHEER; c.until = s.t + (CFG.SAUCER_T + CFG.LIFT_T) * K; ai.push(i); } }
  for (let k = 0; k < a.need; k++){ ringSlot(a, k, _CS); loop.push({ x: _CS.x, z: _CS.z }); }
  a.state = 'zapped'; a.capT = s.t; a.vx = 0; a.vz = 0; a.rk = 0; a.ra = 0;
  const xk = a.boss ? 1 : xpFactor(ringCap(q) / a.need), gain = a.v * xk, boss = !!a.boss, golds = a.gold ? 1 : 0;
  s.streak = s.t - s.lastCapT <= P.COMBO_WIN ? s.streak + 1 : 1; s.lastCapT = s.t;
  let winning = false;
  if (q === s && s.mode !== 'battle'){
    if (s.goal.type === 'order' && s.goal.items[a.sp]){ s.order[a.sp] = (s.order[a.sp] || 0) + 1; emit(s, 'order', { sp: a.sp, have: s.order[a.sp], need: s.goal.items[a.sp] }); }
    if (golds){ s.goldN += golds; emit(s, 'gold', { n: s.goldN }); }
    s.bestCombo = Math.max(s.bestCombo, s.streak);
    winning = goalMet(s, boss);
  }
  q.freezeUntil = s.t + CFG.FREEZE_T;                               // короткий удар, как у кольца
  const cap = { id: ++s.capSeq, q: q.id, t0: s.t, ids: [a.id], gain, cx: a.x, cz: a.z, boss, ringN: a.need, loop, recruited: false, done: false, winning, eat: [], gold: golds };
  s.caps.push(cap); q.captures++; q.abducted++; q.score += gain;
  if (q === s && s.firstCaptureT < 0) s.firstCaptureT = s.t;
  emit(s, 'close', { cap: cap.id, ids: [a.id], ringN: a.need, loop, gain, combo: s.streak, boss, q: q.id, eat: [], pens: 0, gold: golds, crowd: true, ai, xk });
}
// Индексы пришельцев толпы ближе R к точке; crewNearest — k ближайших идущих (не из кружков).
function crewNear(q, x, z, R){ const out = []; for (let i = 1; i < q.n; i++) if (Math.hypot(q.al[i * 2] - x, q.al[i * 2 + 1] - z) < R) out.push(i); return out; }
function crewNearest(q, x, z, k){
  const ids = []; for (let i = 1; i < q.n; i++) if (q.crew[i].m === PM.FOLLOW) ids.push(i);
  ids.sort((a, b) => Math.hypot(q.al[a * 2] - x, q.al[a * 2 + 1] - z) - Math.hypot(q.al[b * 2] - x, q.al[b * 2 + 1] - z));
  return ids.slice(0, k);
}
// Сбить пришельцев толпы (угроза): становятся отбившимися (ждут генерала, как после разреза строя). На место выбывшего —
// последний (порядок в толпе не важен). cut — это «разрез»: его гасит силовое поле (прокачка), тогда −1.
function knockAliens(s, q, idxs, fx, fz, cut){
  if (!idxs.length) return 0;
  if (cut && q.shield > 0){ q.shield--; emit(s, 'shield', { x: fx, z: fz, q: q.id, left: q.shield }); return -1; }
  const wait = q === s ? s.strayT : CFG.STRAY_T, al = q.al, C = q.crew;
  const ids = idxs.filter(i => i >= 1 && i < q.n).sort((a, b) => b - a);
  for (const i of ids){
    const x = al[i * 2], z = al[i * 2 + 1], d = Math.hypot(x - fx, z - fz) || 1, a = (s.rnd() - 0.5) * 1.2, sp = CFG.STRAY_SPEED * (1.3 + 0.5 * s.rnd());
    const ux = (x - fx) / d, uz = (z - fz) / d, rx = ux * Math.cos(a) - uz * Math.sin(a), rz = ux * Math.sin(a) + uz * Math.cos(a);
    s.strays.push({ id: s.nextStray++, owner: q.id, x, z, vx: rx * sp, vz: rz * sp, t0: s.t, until: s.t + wait, fly: 1 });
    const j = q.n - 1;
    if (i !== j){ al[i * 2] = al[j * 2]; al[i * 2 + 1] = al[j * 2 + 1]; C[i] = C[j]; }
    q.n--; C.length = Math.max(1, q.n); al.length = q.n * 2;
  }
  if (q === s) s.lostTotal += ids.length; q.cutsTaken += cut ? 1 : 0;
  while (s.strays.length > CFG.STRAY_MAX){ const o = s.strays.shift(); if (o.owner === s.id) s.strayLost++; emit(s, 'strayLost', { id: o.id, x: o.x, z: o.z }); }
  return ids.length;
}
// Угрозы против толпы: трактор раскидывает всех, кого задел; сторож — всех у точки удара.
function pileCuts(s){
  const q = s;
  for (const T of s.tractors){
    if (s.t - T.cutT < CFG.TRACTOR_CUT_CD) continue;
    const hit = []; for (let i = 1; i < q.n; i++) if (tractorHit(T, q.al[i * 2], q.al[i * 2 + 1], CFG.ALIEN_R)) hit.push(i);
    if (!hit.length) continue;
    const x = q.al[hit[0] * 2], z = q.al[hit[0] * 2 + 1], lost = knockAliens(s, q, hit, T.x, T.z, true);
    if (lost !== 0){ T.cutT = s.t; if (lost > 0){ s.cuts++; emit(s, 'cut', { by: 'tractor', lost, x, z, n: q.n, q: 0 }); } }
  }
  for (const C of s.chasers){
    if (C.mode === 'cheer' || C.mode === 'tired') continue;
    let first = -1; for (let i = 1; i < q.n; i++) if (Math.hypot(q.al[i * 2] - C.x, q.al[i * 2 + 1] - C.z) < CFG.CHASER_R + CFG.ALIEN_R){ first = i; break; }
    if (first < 0) continue;
    const x = q.al[first * 2], z = q.al[first * 2 + 1], lost = knockAliens(s, q, crewNear(q, x, z, CFG.PILE.KNOCK_R), C.x, C.z, true);
    if (lost > 0){ s.cuts++; emit(s, 'cut', { by: 'chaser', lost, x, z, n: q.n, q: 0 }); }
    C.mode = 'cheer'; C.until = s.t + CFG.CHASER_CD;
  }
}
// Бот для толпы: идёт к самой «вкусной» цели по силам (главная цель — когда по силам, кучка мелочи рядом ценнее одиночки)
// и стоит рядом, пока кружок держит. Трактор на колее объезжает.
function pileBotInput(s, B, q){
  q = q || s; const Ld = q.leader;
  if (!B.tg || B.tg.state !== 'free' || s.t > B.tgUntil){ B.tg = pilePick(s, q); B.tgUntil = s.t + 3; }
  const a = B.tg; if (!a) return { active: false, tx: Ld.x, tz: Ld.z };
  let st = null, sd = 8;                                          // свои отбившиеся рядом — сначала подобрать (живой так и делает)
  for (const o of s.strays) if (o.owner === q.id && o.until - s.t > 1){ const d = Math.hypot(o.x - Ld.x, o.z - Ld.z); if (d < sd){ sd = d; st = o; } }
  if (st) return botAvoid(s, { active: true, tx: st.x, tz: st.z }, q);
  if (Math.hypot(a.x - Ld.x, a.z - Ld.z) < ringR(a) + 1) return { active: false, tx: Ld.x, tz: Ld.z };   // стоит рядом, курс — на зверя: он в конусе
  return botAvoid(s, { active: true, tx: a.x, tz: a.z }, q);         // трактор, сторож, электропастух — как у ботов обводки
}
function pilePick(s, q){
  const Ld = q.leader, g = s.goal; let best = null, bs = -1e9;
  for (const a of s.animals){
    if (a.state !== 'free' || a.need > ringCap(q) || a.hid || a.swim && !a.boss) continue;
    let v = a.v * xpFactor(ringCap(q) / a.need);
    if (a.boss) v = g.type === 'boss' ? 1e3 : v;
    if (a.gold) v *= g.type === 'gold' ? 30 : 3;
    if (g.type === 'order' && g.items[a.sp] && (s.order[a.sp] || 0) < g.items[a.sp]) v *= 4;
    let near = 0; for (const b of s.animals) if (b !== a && b.state === 'free' && b.need <= ringCap(q) && Math.abs(b.x - a.x) < 3 && Math.abs(b.z - a.z) < 3) near += b.v;
    const d = Math.hypot(a.x - Ld.x, a.z - Ld.z), sc = (v + near * 0.6) / (d + 4);
    if (sc > bs){ bs = sc; best = a; }
  }
  return best;
}
// Похищения по таймлайну: пополнение отряда и уход зверей на тарелку.
function stepCaptures(s){
  for (const c of s.caps){
    const q = s.squads[c.q] || s, K = q === s ? (s.capK || 1) : 1;      // скорая тарелка — только у своего отряда
    if (!c.recruited && s.t >= (c.recT !== undefined ? c.recT : c.t0 + CFG.RECRUIT_T * K)){
      c.recruited = true;
      emit(s, 'recruit', { cap: c.id, xp: c.gain, n: q.n, q: q.id });
      if (q.alive) gainXp(s, q, c.gain);
    }
    if (!c.done && s.t >= (c.endT !== undefined ? c.endT : c.t0 + (CFG.SAUCER_T + CFG.LIFT_T) * K)){
      c.done = true;
      for (const id of c.ids){
        const k = s.animals.findIndex(a => a.id === id); if (k < 0) continue;
        const a = s.animals[k]; s.animals.splice(k, 1);
        if (!a.boss && !a.gold && !s.L.noRespawn) s.respawnQ.push({ sp: a.sp, r: a.r, home: a.home, at: s.t + CFG.RESPAWN_T });   // главная цель, золотые и звери обучения не возвращаются
      }
      emit(s, 'abducted', { cap: c.id });
      if (c.winning && !s.won && !s.lost){ s.won = true; s.endT = s.t; emit(s, 'win', { t: s.t }); }
    }
  }
  s.caps = s.caps.filter(c => !(c.done && c.recruited));
}

// Один шаг мира. input: { active, tx, tz } — точка, к которой идёт ведущий, или { active, vx, vz } — скорость (или active=false — стоять).
function step(s, input){
  if (s.mode === 'battle') return stepBattle(s, input);
  const dt = CFG.DT; s.t += dt;
  // 1) похищения по таймлайну
  stepCaptures(s);
  const over = s.won || s.lost, frozen = over || s.t < s.freezeUntil;
  // 2) ведущий
  moveLeader(s, s, input);
  if (!over) stepHazards(s);
  stepIce(s); stepWind(s);
  updateHeading(s);
  // 3) путь, разрезы
  const moved = advancePath(s);
  if (s.crew) stepCrew(s, s);                                        // «Куча-мала»: толпа окружает зверей
  if (s.beam) stepBeam(s);                                           // «Тарелка»: луч поднимает тех, кто влезает
  if (s.aim) stepAim(s, input);                                      // «Наводка»: выстрелы и удары лучом
  if (s.aim && !over) stepAimThreats(s);                             // «Наводка»: пёс, стрелок, норы
  if (!over){ cutChain(s); stepLights(s); stepTornados(s); }
  // 4) замыкание
  if (moved && !frozen && !s.crew) tryClose(s, s);
  // 5) животные
  stepHomes(s);                                                       // «Наводка»: стада бродят и иногда сбиваются в кучку
  stepAnimals(s);
  stepHuskies(s); stepThieves(s);
  // 6) респаун, золото, отбившиеся
  stepRespawn(s); stepGold(s); stepStrays(s);
  stepGrass(s); stepOasis(s);                                              // заросли: кто спрятан; оазис: расписание водопоя
  // 7) таймер (с бонусом за пополнение сверх потолка); похищение, которое закрывает цель, доигрывается
  if (!over && s.t >= timeLimit(s) && !s.caps.some(c => c.winning)){ s.lost = true; s.endT = s.t; emit(s, 'lose', { t: s.t }); }
}

// ---------------- битва отрядов ----------------
function killSquad(s, r, by){
  r.alive = false; r.deaths++; r.respawnAt = s.t + CFG.BATTLE_RESPAWN;
  if (by) by.kills++;
  emit(s, 'eat', { by: by ? by.id : -1, victim: r.id, n: r.n, x: r.leader.x, z: r.leader.z, al: r.al.slice(0, r.n * 2) });
  r.n = 0; r.al.length = 0; r.leader.vx = 0; r.leader.vz = 0;
}
function respawnSquad(s, r){
  let x = 0, z = 0, best = -1;
  for (let tries = 0; tries < 24; tries++){                  // подальше от чужих генералов, не в воде и не в загоне
    const cx = (s.rnd() * 2 - 1) * (s.FX - 4), cz = (s.rnd() * 2 - 1) * (s.FZ - 4);
    if (blocked(s, cx, cz, 1)) continue;
    let m = Infinity; for (const o of s.squads) if (o !== r && o.alive) m = Math.min(m, Math.hypot(o.leader.x - cx, o.leader.z - cz));
    if (m > best){ best = m; x = cx; z = cz; } if (m > CFG.BATTLE_SAFE_R) break;
  }
  const d = Math.hypot(x, z) || 1;
  Object.assign(r, { n: r.start, lvl: 0, xp: 0, capFull: false, alive: true, freezeUntil: s.t + 0.5, hitCdUntil: 0 });
  placeSquad(r, x, z, -x / d, -z / d);
  emit(s, 'respawn', { q: r.id, x, z });
}
// Генерал и чужой строй: крупный отряд (в BATTLE_CUT_K раз больше) режет строй мелкого, мелкий в чужой строй упирается как в стену —
// поэтому окружённого генерала можно запереть и обвести. После разреза строй BATTLE_IMMUNE секунд не режется. Генералы сталкиваются лбами.
function battleContacts(s){
  const rr = 2 * CFG.ALIEN_R;
  for (const q of s.squads){
    if (!q.alive) continue;
    const Ld = q.leader;
    for (const r of s.squads){
      if (r === q || !r.alive) continue;
      const dx0 = Ld.x - r.leader.x, dz0 = Ld.z - r.leader.z, d0 = Math.hypot(dx0, dz0);
      if (d0 < rr * 1.25 && d0 > 1e-6){ const push = (rr * 1.25 - d0) / 2, nx = dx0 / d0, nz = dz0 / d0; Ld.x += nx * push; Ld.z += nz * push; r.leader.x -= nx * push; r.leader.z -= nz * push; }
      const strong = q.n >= r.n * CFG.BATTLE_CUT_K && s.t >= (r.immuneUntil || 0);
      for (let i = 1; i < r.n; i++){
        const ax = r.al[i * 2 - 2], az = r.al[i * 2 - 1], bx = r.al[i * 2], bz = r.al[i * 2 + 1];
        if (Math.min(ax, bx) - rr > Ld.x || Math.max(ax, bx) + rr < Ld.x || Math.min(az, bz) - rr > Ld.z || Math.max(az, bz) + rr < Ld.z) continue;
        const p = segClosest(Ld.x, Ld.z, ax, az, bx, bz); let dx = Ld.x - p.x, dz = Ld.z - p.z, d = Math.hypot(dx, dz);
        if (d >= rr) continue;
        if (strong && i >= CFG.CUT_KEEP){
          const lost = looseAliens(s, i, Ld.x, Ld.z, r, true);
          r.immuneUntil = s.t + CFG.BATTLE_IMMUNE;
          if (lost > 0){ q.cutsMade++; if (r === s) s.cuts++; emit(s, 'cut', { by: 'squad', byq: q.id, q: r.id, lost, x: bx, z: bz, n: r.n }); }
          break;
        }
        if (d < 1e-6){ const ex = bx - ax, ez = bz - az, el = Math.hypot(ex, ez) || 1; dx = -ez / el; dz = ex / el; if (Ld.vx * dx + Ld.vz * dz > 0){ dx = -dx; dz = -dz; } d = 1; }
        const nx = dx / d, nz = dz / d; Ld.x = p.x + nx * rr; Ld.z = p.z + nz * rr;
        const vn = Ld.vx * nx + Ld.vz * nz; if (vn < 0){ Ld.vx -= vn * nx; Ld.vz -= vn * nz; }
      }
    }
  }
}
function stepBattle(s, input){
  const dt = CFG.DT; s.t += dt;
  stepCaptures(s);
  const over = s.over;
  const moved = [];
  for (const q of s.squads){
    if (!q.alive){ if (!over && s.t >= q.respawnAt) respawnSquad(s, q); moved.push(false); continue; }
    const frozen = over || s.t < q.freezeUntil;
    moveLeader(s, q, q === s ? input : botInput(s, q.bot, q));
    updateHeading(q);
    moved.push(advancePath(q) && !frozen);
  }
  if (!over){ battleContacts(s); stepLights(s); stepTornados(s); }
  s.squads.forEach((q, i) => { if (moved[i] && q.alive) tryClose(s, q); });
  stepAnimals(s);
  stepRespawn(s); stepGold(s); stepStrays(s);
  if (!over && s.t >= s.L.time){
    s.over = true; s.endT = s.t;
    const st = standings(s); s.rank = st.findIndex(o => o.id === s.id) + 1; s.won = s.rank === 1;
    emit(s, 'battleEnd', { rank: s.rank, standings: st });
  }
}
// Таблица мест: очки (опыт за всю битву: звери, чужие отбившиеся, похищенные отряды), при равенстве — размер отряда сейчас.
function standings(s){
  return s.squads.map(q => ({ id: q.id, score: Math.round(q.score), n: q.alive ? q.n : 0, kills: q.kills, abducted: q.abducted, peak: q.peak }))
    .sort((a, b) => b.score - a.score || b.n - a.n || b.kills - a.kills || a.id - b.id);
}

function checkUnlocks(s){
  if (s.aim){                                                     // «Наводка»: открыт тот, кто влезает в прицел
    for (const sp of levelSpecies(s.L)) if (!s.unlocked[sp] && spR(s.L, sp) + CFG.AIM.PAD <= aimR(s)){ s.unlocked[sp] = true; emit(s, 'unlock', { sp }); }
    const b = s.animals.find(a => a.id === s.bossId);
    if (b && !s.unlocked.__boss && aimNeedR(b) <= aimR(s)){ s.unlocked.__boss = true; emit(s, 'unlock', { sp: b.sp, boss: true }); }
    return;
  }
  if (s.beam){                                                    // «Тарелка»: открыт тот, кто влезает в луч
    for (const sp of levelSpecies(s.L)) if (!s.unlocked[sp] && spR(s.L, sp) + CFG.BEAM.PAD <= beamR(s)){ s.unlocked[sp] = true; emit(s, 'unlock', { sp }); }
    const b = s.animals.find(a => a.id === s.bossId);
    if (b && !s.unlocked.__boss && beamNeedR(b) <= beamR(s)){ s.unlocked.__boss = true; emit(s, 'unlock', { sp: b.sp, boss: true }); }
    return;
  }
  for (const sp of levelSpecies(s.L)){
    if (!s.unlocked[sp] && ringCap(s) >= needFor(s.pile, spR(s.L, sp))){ s.unlocked[sp] = true; emit(s, 'unlock', { sp }); }
  }
  const boss = s.animals.find(a => a.id === s.bossId);
  if (boss && !s.unlocked.__boss && ringCap(s) >= bossNeedOf(s)){ s.unlocked.__boss = true; emit(s, 'unlock', { sp: boss.sp, boss: true }); }
  for (const p of s.pens) if (!s.unlocked['pen' + p.k] && s.n >= penNeedUI(p)){ s.unlocked['pen' + p.k] = true; emit(s, 'unlock', { pen: p.k, sp: p.sp }); }
}

// Ищет точку своего строя, к которой голова ближе radius (с учётом MIN_LOOP_ARC, closeFloorS и хвоста).
// Один источник для замыкания (radius = CLOSE_R) и для подсветки-превью в оболочке (radius больше). q — отряд.
function findLoop(q, radius){
  const H = q.hist, Ld = q.leader;
  const lo = Math.max(q.closeFloorS, q.headS - squadLen(q)), hi = q.headS - CFG.MIN_LOOP_ARC;
  if (hi <= lo) return null;
  let best = -1, bd = radius;
  for (let j = H.length - 2; j >= 0; j--){
    const p = H[j]; if (p.s > hi) continue; if (p.s < lo) break;
    const d = Math.hypot(p.x - Ld.x, p.z - Ld.z);
    if (d < bd){ bd = d; best = j; }
  }
  if (best < 0) return null;
  const poly = H.slice(best);
  if (polyArea(poly) < CFG.MIN_LOOP_AREA) return null;
  return { best, d: bd, poly, lo, atTail: H[best].s - lo < CFG.SPACING * 1.5 };
}
// Кто в кольце: ids — влезли и будут похищены, tight — центр внутри, но кольцо их режет.
function classifyLoop(s, poly){
  let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
  for (const p of poly){ if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x; if (p.z < z0) z0 = p.z; if (p.z > z1) z1 = p.z; }
  const ids = [], tight = [];
  for (const a of s.animals){
    if (a.state !== 'free' || a.x < x0 || a.x > x1 || a.z < z0 || a.z > z1 || !pointInPoly(a.x, a.z, poly)) continue;
    if (distToPoly(a.x, a.z, poly) >= CFG.FIT_K * a.r) ids.push(a.id); else tight.push(a);
  }
  return { ids, tight };
}
// Цель уровня выполнена (после учёта этого кольца)?
function goalMet(s, boss){
  const g = s.goal;
  if (g.type === 'boss') return !!boss;
  if (g.type === 'order') return Object.keys(g.items).every(sp => (s.order[sp] || 0) >= g.items[sp]);
  if (g.type === 'orders') return s.ordI >= g.list.length;
  if (g.type === 'gold') return s.goldN >= g.n;
  if (g.type === 'combo') return s.bestCombo >= g.n;
  return false;
}
function tryClose(s, q){
  q = q || s;
  const H = q.hist, f = findLoop(q, CFG.CLOSE_R);
  if (!f) return;
  const poly = f.poly, best = f.best;
  q.closeFloorS = q.headS;
  const ringN = Math.min(q.n, Math.floor((q.headS - H[best].s) / CFG.SPACING) + 1);
  const { ids, tight } = classifyLoop(s, poly);
  const eat = [];                                                        // битва: чужие генералы в кольце
  if (s.mode === 'battle') for (const r of s.squads) if (r !== q && r.alive && pointInPoly(r.leader.x, r.leader.z, poly) && distToPoly(r.leader.x, r.leader.z, poly) >= CFG.ALIEN_R) eat.push(r);
  const stp = Math.max(1, Math.floor(poly.length / CFG.LOOP_PTS)), loop = [];
  for (let i = 0; i < poly.length; i += stp) loop.push({ x: poly[i].x, z: poly[i].z });
  if (!ids.length && !eat.length){
    if (q === s){ if (tight.length){ s.failedTight++; for (const a of tight) emit(s, 'tight', { id: a.id, need: needUI(a.r) }); } else s.emptyLoops++; }
    emit(s, 'close', { cap: 0, ids: [], ringN, loop, q: q.id });
    return;
  }
  q.freezeUntil = s.t + CFG.FREEZE_T;        // стоп только когда есть добыча
  let gain = 0, cx = 0, cz = 0, boss = false, golds = 0; const bySp = {};
  for (const id of ids){
    const a = s.animals.find(o => o.id === id);
    a.state = 'zapped'; a.capT = s.t; a.vx = 0; a.vz = 0;
    gain += a.v; cx += a.x; cz += a.z; if (a.boss) boss = true; if (a.gold) golds++;
    bySp[a.sp] = (bySp[a.sp] || 0) + 1;
  }
  if (ids.length) gain = gain * (1 + q.comboK * (ids.length - 1));
  let pens = 0;                                                           // загон обведён целиком
  for (const p of s.pens){
    const all = [[-1, -1], [1, -1], [1, 1], [-1, 1]].every(([sx, sz]) => pointInPoly(p.x + sx * p.hw, p.z + sz * p.hh, poly));
    if (all && ids.some(id => { const a = s.animals.find(o => o.id === id); return a.home && a.home.pen === p.k; })){ pens++; emit(s, 'pen', { k: p.k, x: p.x, z: p.z, q: q.id }); }
  }
  if (pens){ gain *= CFG.PEN_BONUS; if (q === s) s.penCaps += pens; }
  for (const r of eat){ gain += r.n * CFG.EAT_K; cx += r.leader.x; cz += r.leader.z; killSquad(s, r, q); }
  const cnt = ids.length + eat.length; cx /= cnt; cz /= cnt;
  let winning = false;
  if (q === s && s.mode !== 'battle'){                                      // прогресс цели уровня
    for (const sp in bySp) if (s.goal.type === 'order' && s.goal.items[sp]){ s.order[sp] = (s.order[sp] || 0) + bySp[sp]; emit(s, 'order', { sp, have: s.order[sp], need: s.goal.items[sp] }); }
    if (golds){ s.goldN += golds; emit(s, 'gold', { n: s.goldN }); }
    s.bestCombo = Math.max(s.bestCombo, ids.length);
    winning = goalMet(s, boss);

  const cap = { id: ++s.capSeq, q: q.id, t0: s.t, ids, gain, cx, cz, boss, ringN, loop, recruited: false, done: false, winning, eat: eat.map(r => r.id), gold: golds };
  s.caps.push(cap); q.captures++; q.abducted += ids.length; q.score += gain;
  if (q === s && s.firstCaptureT < 0) s.firstCaptureT = s.t;
  emit(s, 'close', { cap: cap.id, ids: ids.slice(), ringN, loop, gain, combo: ids.length, boss, q: q.id, eat: cap.eat, pens, gold: golds });
}

function nearestSquad(s, x, z){
  if (s.squads.length === 1) return s.alive ? s : null;
  let best = null, bd = Infinity;
  for (const q of s.squads){ if (!q.alive) continue; const d = (q.leader.x - x) ** 2 + (q.leader.z - z) ** 2; if (d < bd){ bd = d; best = q; } }
  return best;
}
// Угрозы и норы «Наводки»: пёс и нора — подальше от старта, не на стадах; фермер — у своего стада (в 2,5–3,5 м от его середины).
function placeAimThreats(s, rnd, L){
  s.dogs = []; s.farmers = []; s.burrows = [];
  const spot = (minD) => { for (let k = 0; k < 60; k++){ const x = (rnd() * 2 - 1) * (s.FX - 3), z = (rnd() * 2 - 1) * (s.FZ - 3);
    if (Math.hypot(x - s.leader.x, z - s.leader.z) < minD || blocked(s, x, z, 1.5) || s.homes.some(h => Math.hypot(h.x - x, h.z - z) < 2.5) || s.burrows.some(b => Math.hypot(b.x - x, b.z - z) < 5)) continue;
    return { x, z }; } return { x: 0, z: -s.FZ * 0.5 }; };
  for (let i = 0; i < (L.dogs || 0); i++){ const p = spot(8); s.dogs.push({ id: i, x: p.x, z: p.z, ox: p.x, oz: p.z, vx: 0, vz: 0, hx: 0, hz: 1, home: p, mode: 'patrol', t0: 0, until: 0, wx: p.x, wz: p.z, nextT: 0 }); }
  const hs = s.homes.filter(h => !h.boss && Math.hypot(h.x - s.leader.x, h.z - s.leader.z) > 7);
  for (let i = 0; i < (L.farmers || 0); i++){ let p = null;
    for (let k = 0; k < 40 && !p; k++){ const h = hs.length ? hs[Math.floor(rnd() * hs.length)] : null; if (!h) break; const a = rnd() * Math.PI * 2, d = 2.5 + rnd(), x = clamp(h.x + Math.cos(a) * d, -s.FX + 1.5, s.FX - 1.5), z = clamp(h.z + Math.sin(a) * d, -s.FZ + 1.5, s.FZ - 1.5);
      if (!blocked(s, x, z, 1) && Math.hypot(x - s.leader.x, z - s.leader.z) > 6 && !s.farmers.some(f => Math.hypot(f.x - x, f.z - z) < 6)) p = { x, z }; }
    s.farmers.push(newFarmer(i, p || spot(8))); }
  for (const b of (L.burrows || [])){ const p = spot(7); s.burrows.push({ id: s.burrows.length, x: p.x, z: p.z, sp: b.sp, out: 0, cd: 0, done: false }); }
}
// Пёс: бродит у дома; увидел прицел — бежит под него; у прицела рычит WIND_T и лает (лай — dogBark); потом сидит довольный.
function aimHeat(s){ return s.lvl / Math.max(1, CFG.AIM.STAGES - 1); }   // 0 на старте … 1 на верхней ступени
function stepDogs(s){
  const D0 = CFG.AIM.DOG, H = CFG.AIM.HEAT, hk = aimHeat(s), D = Object.assign({}, D0, { SEE_R: D0.SEE_R + H.DOG_SEE * hk, RUN_V: D0.RUN_V * (1 + H.DOG_V * hk) });

  for (const d of s.dogs){
    const dx = Ld.x - d.x, dz = Ld.z - d.z, dl = Math.hypot(dx, dz) || 1e-3; let vx = 0, vz = 0; d.ox = d.x; d.oz = d.z;

      else { if (t >= d.nextT || Math.hypot(d.wx - d.x, d.wz - d.z) < 0.3){ const a = s.rnd() * Math.PI * 2, r = 1 + s.rnd() * 3; d.wx = clamp(d.home.x + Math.cos(a) * r, -s.FX + 1, s.FX - 1); d.wz = clamp(d.home.z + Math.sin(a) * r, -s.FZ + 1, s.FZ - 1); d.nextT = t + 2 + s.rnd() * 2; }

function dogBark(s, d){
  const D = CFG.AIM.DOG, t = s.t, Ld = s.leader, ids = [];
  for (const a of s.animals){ if (a.state !== 'free' || a.boss || a.mark || a.held) continue; const ex = a.x - d.x, ez = a.z - d.z, e = Math.hypot(ex, ez);   // под недокрученным кругом — тоже: захват сорван
    if (e < D.SCARE_R && e > 1e-3){ a.spookUntil = t + 1.1; a.wx = ex / e; a.wz = ez / e; a.lockedUntil = 0; ids.push(a.id); } }
  const near = Math.hypot(Ld.x - d.x, Ld.z - d.z) < D.BARK_R + 0.8;
  if (near){ s.lock = 0; s.stunUntil = Math.max(s.stunUntil || 0, t + D.STUN_T); }
  emit(s, 'dogBark', { id: d.id, x: d.x, z: d.z, ids, near });
}
// Фермер (06.10): сторожит своих — зверя ближе WATCH_R берут прицелом (под крутящимся кругом, помечен или уже поднимается в луче)
// — «ЭЙ!», через REACT_T бежит к нему; успел (ближе GRAB_R, пока подъём не кончился) — отбирает (farmRescue): зверь не похищен,
// держит его HOLD_T, потом отпускает (тот удирает) и гордится PROUD_T; не успел — «ЭХ!» LATE_T. Потом пауза CD и назад к стаду.
// Боссов и золотых не трогает. Тарелке ничего не делает. Скорость и радиус растут со ступенью (HEAT).
function newFarmer(id, p){ return { id, x: p.x, z: p.z, ox: p.x, oz: p.z, vx: 0, vz: 0, hx: 0, hz: 1, home: { x: p.x, z: p.z }, mode: 'idle', t0: 0, until: 0, cd: 0, tgt: 0, aid: 0 }; }
function farmPar(s){ const F = CFG.AIM.FARM, H = CFG.AIM.HEAT, hk = aimHeat(s); return Object.assign({}, F, { WATCH_R: F.WATCH_R + H.FARM_R * hk, RUN_V: F.RUN_V * (1 + H.FARM_V * hk) }); }
function farmLifting(s, a){ return a.state === 'zapped' && s.caps.some(c => !c.recruited && c.ids.includes(a.id)); }
function farmAimed(s, a){ return a.state === 'free' && !a.held && (!!a.mark || (s.lock > 0 && a.lockedUntil > s.t)); }
function farmPrey(s, f, F){

function stepFarmers(s){
  const F = farmPar(s), dt = CFG.DT, t = s.t, Ld = s.leader, calm = s.tutNoAuto || s.won || s.lost || !!s.bossGame;
  for (const f of s.farmers){
    f.ox = f.x; f.oz = f.z; let vx = 0, vz = 0;
    if (f.mode === 'idle' || f.mode === 'back'){
      if (!calm && t >= f.cd){ const a = farmPrey(s, f, F); if (a){ f.mode = 'run'; f.tgt = a.id; f.t0 = t; emit(s, 'farmRun', { id: f.id, x: f.x, z: f.z, sp: a.sp }); } }

    }

    }

      if (a){ const o = 0.42 + a.r * 0.5; a.x = f.x + f.hx * o; a.z = f.z + f.hz * o; a.vx = 0; a.vz = 0; a.lockedUntil = 0; }

    const k = Math.min(1, dt * 10); f.vx += (vx - f.vx) * k; f.vz += (vz - f.vz) * k;

// Отобрал: из луча (уже поднимается — из похищения: опыт за него снят) или из-под прицела (метка снята); держит у груди.
function farmRescue(s, f, a){
  const air = a.state === 'zapped';
  if (air){ const c = s.caps.find(o => !o.recruited && o.ids.includes(a.id));
    if (c){ c.ids = c.ids.filter(id => id !== a.id); c.gain = Math.max(0, c.gain - ((c.share && c.share[a.id]) || 0)); if (!c.ids.length){ c.recruited = true; c.done = true; } }
    s.abducted = Math.max(0, s.abducted - 1); a.state = 'free'; }
  for (const m of s.marks){ const i = m.ids.indexOf(a.id); if (i >= 0) m.ids.splice(i, 1); }
  a.mark = 0; a.lockedUntil = 0; a.held = f.id + 1; a.vx = 0; a.vz = 0; a.spookUntil = 0;
  f.mode = 'hold'; f.aid = a.id; f.tgt = 0; f.until = s.t + CFG.AIM.FARM.HOLD_T;
  emit(s, 'farmSave', { id: f.id, aid: a.id, sp: a.sp, x: a.x, z: a.z, air });

// Прожектор и «Наводка» (06.10): тарелку не трогает; помеченный зверь, на которого наехал свет, — метка слетает («засветили» —
// отменяем); помечать в свете нельзя (aimScan), а удар по пятну никого не берёт (aimScan в resolveStrike).
function aimLightStep(s, Lt, p){
  if (s.bossGame) return;
  for (const a of s.animals){ if (!a.mark || a.state !== 'free' || Math.hypot(a.x - p.x, a.z - p.z) >= Lt.r) continue;
    a.mark = 0; a.lockedUntil = 0; for (const m of s.marks){ const i = m.ids.indexOf(a.id); if (i >= 0) m.ids.splice(i, 1); }
    const n0 = s.marks.length; s.marks = s.marks.filter(m => m.ids.length); emit(s, 'markLit', { id: a.id, x: a.x, z: a.z, dropped: n0 - s.marks.length }); }

// Нора: морковка рядом — золотой зверь выбегает к ней (жуёт, пока она лежит); морковки нет — бежит назад и прячется на CD.

  const B = CFG.AIM.BURROW, t = s.t, bt = s.baits && s.baits[0];

    if (b.done) continue;
    if (!b.out){ if (bt && !s.tutNoAuto && t >= b.cd && Math.hypot(bt.x - b.x, bt.z - b.z) < B.LURE_R){

function stepAimThreats(s){ aimReinforce(s); stepDogs(s); stepFarmers(s); stepBurrows(s); }
// Подмога (L.reinforce: [{ at: ступень, dogs: n, farmers: n }]): тарелка доросла — с края поля, вне экрана (10–12 м от прицела),
// приходит ещё пёс или фермер. Индекс s.reinf — в состоянии (данные уровня не трогаем).
function aimReinforce(s){
  const RF = s.L.reinforce; if (!RF || s.tutNoAuto || s.won || s.lost) return;
  while (s.reinf < RF.length && s.lvl >= RF[s.reinf].at){ const r = RF[s.reinf++], Ld = s.leader;
    const spot = () => { for (let k = 0; k < 40; k++){ const a = s.rnd() * Math.PI * 2, d = 10 + s.rnd() * 2, x = clamp(Ld.x + Math.cos(a) * d, -s.FX + 1.5, s.FX - 1.5), z = clamp(Ld.z + Math.sin(a) * d, -s.FZ + 1.5, s.FZ - 1.5);
      if (Math.hypot(x - Ld.x, z - Ld.z) > 8 && !blocked(s, x, z, 1)) return { x, z }; } return { x: clamp(-Ld.x, -s.FX + 2, s.FX - 2), z: clamp(-Ld.z, -s.FZ + 2, s.FZ - 2) }; };

const BOTS = {

  hunter: { pad: 0.32, wobble: 0,    think: 0,    wrong: 0,    slack: 1.08 },
  pro:    { pad: 0.32, wobble: 0,    think: 0,    wrong: 0,    slack: 1.08, cluster: true },
  bully:  { pad: 0.55, wobble: 0.35, think: 0.8,  wrong: 0.1,  slack: 1.0, bully: true },          // соперники — умением новички:
  sly:    { pad: 0.5,  wobble: 0.3,  think: 0.7,  wrong: 0.08, slack: 1.0,  cluster: true, hunt: true },   // живой игрок вдвое медленнее бота,
  greedy: { pad: 0.55, wobble: 0.35, think: 0.8,  wrong: 0.1,  slack: 1.0 },                         // и битва должна быть ему по силам

function makeBot(kind, seed){ return { kind, seed: seed || 1, rnd: mulberry32(seed || 1), tg: null, fixFor: '', cx: 0, cz: 0, R: 0, startT: 0, nextT: 0, tx: 0, tz: 0, dir: 1, fails: 0, ban: {}, route: null, ri: 0, routeT: 0, bullyT: 0, lastCuts: 0 }; }

// Круг вокруг цели: центр и радиус (у pro и у кучи — вокруг подходящих соседей).

function botPatience(s, q, P, tg){

// Куча зверей для цели «комбо»: самая плотная, которую отряд в силах обвести (кружащиеся после смерча — в приоритете).
function botCluster(s, q, P, free){
  let best = null;
  for (const a of free){
    if (a.swim || a.boss || inPenAnimal(a)) continue;
    if (s.tornados.some(T => T.state === 'spin' && Math.hypot(a.x - T.x, a.z - T.z) < T.pull + 1.5)) continue;
    const mates = free.filter(b => Math.hypot(b.x - a.x, b.z - a.z) < 2.6 && !b.swim && !inPenAnimal(b));
    if (mates.length < 4) continue;
    let cx = 0, cz = 0; for (const b of mates){ cx += b.x; cz += b.z; } cx /= mates.length; cz /= mates.length;
    let R = 0; for (const b of mates) R = Math.max(R, Math.hypot(b.x - cx, b.z - cz) + botR0(P, b.r));

    if (s.oasis && oasisGap(s.oasis, cx, cz) < R + 0.3) continue;            // у пруда кучу отдельно не обвести (только весь водопой)

// Бегемот в реке: петля через два ближайших моста (по обе стороны от него) и обратно к началу петли.
function hippoRoute(s, boss, q){

// Цель за рекой: сначала ближайший удобный мост.

  const boss = s.bossId ? free.find(a => a.id === s.bossId) : null;

    if (!wrong && !botFits(q, P, o.r)) continue;
    const R0 = botR0(P, o.r);
    if (s.fences.some(f => distToSeg(o.x, o.z, f.ax, f.az, f.bx, f.bz) < R0 + 0.3)) continue;   // у электропастуха не обвести
    if (s.walls.some(w => distToSeg(o.x, o.z, w.ax, w.az, w.bx, w.bz) < R0 + 0.2)) continue;  // у стенки тоже
    if (s.river && riverGap(s.river, o.x, o.z) < R0 + 0.3) continue;                           // и у воды
    if (s.oasis && oasisGap(s.oasis, o.x, o.z) < R0 + 0.3) continue;                           // и у пруда
    if (s.tornados.some(T => T.state === 'spin' && Math.hypot(o.x - T.x, o.z - T.z) < T.pull + 1.5)) continue;   // в хороводе не поймать

// Бот обходит угрозы: отталкивание точки-цели от трактора (и его места через 0.7 с), сторожа, электропастуха, пятна прожектора и смерча.

    const p = lightPos(Lt, s.t + ahead), dx = L.x - p.x, dz = L.z - p.z, d = Math.hypot(dx, dz) || 1e-3, m = Lt.r + 2.2;

  return inp;
}

// Лёд и буря для ботов (урок v2: без логики правила аудит врёт). Точка-цель круга → скорость, как ведёт палец:
// на льдине (или к цели на льдине) бот сбавляет ход, чтобы инерция не выносила его с кольца радиуса R (v² ≤ ускорение × R);
// в порыв берёт поправку против сноса — человек видит полосы и рулит против ветра. Новичок тормозит позже и поправляется хуже.
function botWeather(s, q, P, inp, R){
  const W = s.wind, Ld = q.leader, windy = W && W.k > 0;
  const icy = s.ice && CFG.ICE_INERTIA > 0 && (floeAt(s, Ld.x, Ld.z) || floeAt(s, inp.tx, inp.tz));
  if (!icy && !windy) return inp;                                       // на снегу и в затишье — как в главе 1
  const cap = speedFor(q.n) * (q.speedK || 1), dx = inp.tx - Ld.x, dz = inp.tz - Ld.z, d = Math.hypot(dx, dz);
  if (d < 1e-4) return inp;
  let sp = cap * Math.min(1, d / CFG.ARRIVE_R);
  if (icy) sp = Math.min(sp, Math.sqrt(cap / CFG.ICE_INERTIA * Math.max(1, R) * (1.0 + P.wobble * 0.7)));
  let vx = dx / d * sp, vz = dz / d * sp;
  if (windy){ const w = W.k * W.push * CFG.SAND_PUSH * Math.max(0, 0.95 - P.wobble * 1.2); vx -= W.dx * w; vz -= W.dz * w; }
  return { active: true, vx, vz };
}
// Прогон уровня ботом целиком (для sim.mjs / test.mjs). maxT — потолок времени; opts.up — прокачка.
function runBot(li, kind, seed, maxT, ws, opts){
  const s = createState(li, ws, opts), B = makeBot(kind, seed);
  const lim = maxT || timeLimit(s) + 5;
  let nAt = [];
  while (!s.won && !s.lost && s.t < lim){
    step(s, botInput(s, B)); s.events.length = 0;
    if (Math.abs(s.t % 10) < CFG.DT) nAt.push(s.n);
  }
  return { win: s.won, t: s.endT || s.t, captures: s.captures, abducted: s.abducted, n: s.n, first: s.firstCaptureT,
    tight: s.failedTight, empty: s.emptyLoops, fails: B.fails, stars: s.won ? stars(s) : 0, nAt, time: s.L.time,
    cuts: s.cuts, lostTotal: s.lostTotal, recovered: s.recovered, strayLost: s.strayLost, overflow: s.overflow, bonusT: s.bonusT,
    goal: s.goal.type, order: Object.assign({}, s.order), goldN: s.goldN, bestCombo: s.bestCombo, pens: s.penCaps, peak: s.peak };
}
// Прогон битвы: игрок — бот kind, соперники — свои характеры. Возвращает место игрока и общую статистику.
function runBattle(kind, seed, ws, opts){
  const s = createBattle(ws, opts), B = makeBot(kind, seed);
  while (!s.over){ step(s, botInput(s, B)); s.events.length = 0; }
  return { rank: s.rank, n: s.alive ? s.n : 0, kills: s.kills, deaths: s.deaths, cutsMade: s.cutsMade, cutsTaken: s.cutsTaken, steals: s.steals, abducted: s.abducted,
    standings: standings(s), totalKills: s.squads.reduce((t, q) => t + q.kills, 0), totalCuts: s.squads.reduce((t, q) => t + q.cutsMade, 0), peak: s.peak };
}

// Перекраска: map — замена цветов (точное совпадение hex), extra — дополнительные детали поверх.
function recolorArt(def, map, extra){
  const m = {}; for (const k in map) m[k.toLowerCase()] = map[k];
  return Object.assign({}, def, { parts: def.parts.map(p => m[p.c.toLowerCase()] ? Object.assign({}, p, { c: m[p.c.toLowerCase()] }) : p).concat(extra || []) });
}
// Золотой зверь: все цвета, кроме глаз и бликов, уходят в золото по яркости (тёмное — в охру, светлое — в лимонное).
function goldArt(def){
  const keep = new Set([EYE, SHINE, '#0b0b14', '#ffffff', '#1d1d22'].map(c => c.toLowerCase()));
  const lo = new THREE.Color('#9a5200'), mid = new THREE.Color('#ffb000'), hi = new THREE.Color('#ffe45c'), c = new THREE.Color();
  return Object.assign({}, def, { parts: def.parts.map(p => {
    if (keep.has(p.c.toLowerCase())) return p;
    const h = parseInt(p.c.slice(1), 16), l = (0.3 * (h >> 16) + 0.59 * ((h >> 8) & 255) + 0.11 * (h & 255)) / 255;
    const t = Math.min(0.9, Math.max(0, (l - 0.2) / 0.7));                  // самое светлое — не белое, а лимонное золото
    if (t < 0.5) c.copy(lo).lerp(mid, t * 2); else c.copy(mid).lerp(hi, (t - 0.5) * 2);
    return Object.assign({}, p, { c: '#' + c.getHexString() });
  }) });
}

// Время эффектов — время симуляции s.t (абсолютное, двигается фиксированным шагом), поэтому drive() и
// замедление работают честно; сглаживание камеры и частицы — реальным временем кадра.
// ===========================================================================
const NAME = 'ufo-squad';
const T0 = performance.now();
// Журнал [game] — одна строка на событие (§11). t — монотонные игровые часы (шаги сима + реальное время вне игры),
// поэтому длительности пар fx.start/fx.end честные и при drive()/speed(); wall — настенное время для человека.
let CLOCK = 0;
function log(kind, name, info){
  console.log('[game] ' + JSON.stringify({ t: +CLOCK.toFixed(3), wall: +((performance.now() - T0) / 1000).toFixed(3), kind, name, info: info === undefined ? '' : String(info) }));
}
const FX_OPEN = new Map();                  // открытые эффекты: name → время конца (CLOCK); закрываются сами
function fxStart(name, dur, info){ if (FX_OPEN.has(name)) log('fx.end', name, 'replaced'); FX_OPEN.set(name, CLOCK + dur); log('fx.start', name, info); }
function fxTick(){ for (const [n, end] of FX_OPEN) if (CLOCK >= end){ FX_OPEN.delete(n); log('fx.end', n); } }
function fxAbort(){ for (const n of FX_OPEN.keys()) log('fx.end', n, 'abort'); FX_OPEN.clear(); }
const SAVE_KEY = NAME + '.v3';
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(G.save)); } catch (e) {} }

function freshSave(){ return { v: 3, ix: 2, level: 0, stars: {}, best: {}, gems: 0, up: {}, album: {}, goldAlbum: {}, bosses: {}, battles: { played: 0, wins: 0, podium: 0 }, battleN: 0,

// Открыть операцию по факту уже собранных звёзд (глава 2, 03.10): LEVELS 10–18 появляются уже после того, как часть
// игроков прошла главу 1 на три звезды — без этой сверки они увидели бы прежний level и не попали на новую карту.
function openByStars(s){
  let mx = -1; for (const k in s.stars) if (s.stars[k]) mx = Math.max(mx, +k);
  s.level = Math.max(s.level, Math.min(mx + 1, LEVELS.length - 1));
  return s;
}
// Раскладка операций (ix): 1 — с Птичьим двором (индекс 1), 2 — без него (05.10, убран по слову Андрея). Звёзды, рекорды и
// счётчик поражений по индексам за убранной операцией сдвигаются на одну, её собственные — пропадают; level — туда же.
const DROPPED_OPS = [1];
function remapIx(s){
  if (s.ix === 2) return s;
  const shift = i => i - DROPPED_OPS.filter(d => d < i).length;
  const mv = o => { const out = {}; for (const k in (o || {})){ const i = +k; if (!DROPPED_OPS.includes(i)) out[shift(i)] = o[k]; } return out; };
  s.stars = mv(s.stars); s.best = mv(s.best); s.loseRun = mv(s.loseRun);
  s.level = Math.max(0, shift(s.level || 0)); s.ix = 2;
  return s;
}
// Сохранение v1 (3 уровня) → v2 (9 операций): Ферма, Ранчо и Сафари встали на места 1, 3 и 6.
// v2 (9 операций) → v3 (скины, новые улучшения): поля v2 переносятся как есть. Без поля ix — раскладка 1 (с Птичьим двором).
function migrateSave(){
  let v3 = null; try { v3 = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  if (v3 && v3.v === 3) return openByStars(remapIx(Object.assign(freshSave(), v3, { ix: v3.ix || 1 })));
  let v2 = null; try { v2 = JSON.parse(localStorage.getItem(NAME + '.v2')); } catch (e) {}
  if (v2 && v2.v === 2) return openByStars(remapIx(Object.assign(freshSave(), v2, { v: 3, ix: 1 })));   // v2 → v3: всё переносится, скины — по умолчанию
  const s = freshSave(); let v1 = null; try { v1 = JSON.parse(localStorage.getItem(NAME + '.v1')); } catch (e) {}
  if (v1){
    const map = [0, 2, 5]; for (const k in (v1.stars || {})) if (map[k] !== undefined) s.stars[map[k]] = v1.stars[k];
    for (const k of ['muted', 'music', 'tutor', 'tipXp', 'bumpTip', 'tipCut', 'tipZap', 'tipHonk', 'tipKeeper', 'shortTip']) if (v1[k] !== undefined) s[k] = v1[k];
    let mx = -1; for (const k in s.stars) if (s.stars[k]) mx = Math.max(mx, +k);
    s.level = mx + 1; s.ix = 1;                                    // пройденное раньше не запирается; «Играть» ведёт на первую непройденную
    remapIx(s); s.level = Math.min(LEVELS.length - 1, s.level);
  }
  return openByStars(s);
}

// Похищенное за партию → альбом (+ кристаллы за новые виды и золото). Вызывается и при победе, и при поражении.
function metaAlbum(rows){
  const R = G.runLog;
  for (const sp in R.species){
    if (!META.ALBUM.includes(sp)) continue;
    if (!G.save.album[sp]) rows.push({ k: 'first', sp, txt: 'New specimen: ' + SP_ONE[sp].toLowerCase(), gems: ECON.FIRST });
    G.save.album[sp] = (G.save.album[sp] || 0) + R.species[sp];
  }
  if (R.gold) rows.push({ k: 'gold', txt: 'Golden animals ×' + R.gold, gems: R.gold * ECON.GOLD });
  for (const sp in (R.goldSp || {})) G.save.goldAlbum[sp] = (G.save.goldAlbum[sp] || 0) + R.goldSp[sp];
}
function metaApply(rows){
  const base = rows.reduce((t, r) => t + r.gems, 0), k = upEffects(G.save.up).gemK;
  if (k > 1 && base > 0) rows.push({ k: 'trophy', txt: 'Trophies +' + Math.round((k - 1) * 100) + '%', gems: Math.round(base * (k - 1)) });
  const total = rows.reduce((t, r) => t + r.gems, 0); G.save.gems = (G.save.gems || 0) + total; save(); return total;
}
function metaWin(s){
  const li = G.li, st = stars(s), prev = G.save.stars[li] || 0, first = !prev, rows = [];
  rows.push({ k: 'win', txt: first ? 'Operation complete' : 'Won again', gems: winGems(li, first) });
  if (st > prev) rows.push({ k: 'stars', txt: 'New stars ×' + (st - prev), gems: (st - prev) * starGems(li) });
  if (s.L.boss && !G.save.bosses[s.L.id]){ G.save.bosses[s.L.id] = true; rows.push({ k: 'boss', sp: s.L.boss.sp, txt: s.L.boss.name + ' added to the album', gems: bossGems(li) }); }
  metaAlbum(rows);
  G.save.stars[li] = Math.max(prev, st);
  G.save.best[li] = Math.min(G.save.best[li] || 1e9, Math.round(s.endT));

  return { rows, total, stars: st, first, time: s.endT };
}

// Улучшение для подсказки стены на экране поражения (глава 2): самое полезное из тех, на что хватает кристаллов, — по порядку
// UP_PRIO ядра (Призыв → Комбо-луч → Ускорители → Скорая тарелка → Магнит → Силовое поле); не хватает ни на одно — самое
// полезное, на него и копить. Без «Трофеев» (нет в UP_PRIO) и без прокачанных до предела.
function wallUp(){
  const ups = META.UP.filter(u => UP_PRIO[u.key] && labCost(u)).sort((a, b) => UP_PRIO[a.key] - UP_PRIO[b.key]);
  return ups.find(u => labCost(u) <= (G.save.gems || 0)) || ups[0] || null;
}
